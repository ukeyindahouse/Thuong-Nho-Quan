<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f1e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1410" media="(prefers-color-scheme: dark)">
<meta name="description" content="Quản lý bill nước, tính giờ bida, thu chi và lãi cho quán Thương Nhớ Quán.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ThuongNhoQuan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html,body{margin:0}html{padding-top:env(safe-area-inset-top,0px)}</style>
<title>ThuongNhoQuan</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Pacifico&display=swap">
<style>
/* Bố cục: một cột, ngón cái với tới, thanh tổng tiền và thanh tab dính đáy.
   Màu: nâu cà phê và kem ấm, xanh nỉ bàn bida cho tiền thu, cam cho tiền chi. */
:root{
  --bg:#f8f1e6; --surface:#fffaf2; --ink:#3a2418; --muted:#7a6454; --line:#e6d8c3;
  --accent:#7b4a2d; --accent-ink:#fff8ee; --accent-soft:#f3e4cf;
  --rev:#2d7a50; --exp:#c0701c; --bad:#b83a2c;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Pacifico","Be Vietnam Pro",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1410; --surface:#2a1e18; --ink:#f4e8d8; --muted:#b9a38f; --line:#43322a;
    --accent:#e9aa5c; --accent-ink:#2a1608; --accent-soft:#3b2b20;
    --rev:#6fcf97; --exp:#f0a14f; --bad:#ff8272; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1410; --surface:#2a1e18; --ink:#f4e8d8; --muted:#b9a38f; --line:#43322a;
  --accent:#e9aa5c; --accent-ink:#2a1608; --accent-soft:#3b2b20;
  --rev:#6fcf97; --exp:#f0a14f; --bad:#ff8272; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font:16px/1.45 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:210px; -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:560px;margin:0 auto}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0 4px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo svg{display:block;width:52px;height:52px;border-radius:14px;flex:none}
.brandname{font-family:var(--display);font-size:23px;line-height:1.2;color:var(--accent);overflow-wrap:anywhere}
.eyebrow{font-size:13px;color:var(--muted)}
.iconbtn{position:relative;flex:none;width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0}
.iconbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:7px;right:7px;width:11px;height:11px;border-radius:50%;background:var(--exp);border:2px solid var(--surface)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:2px 0 12px}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--rev)}
.dot.warn{background:var(--exp)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.grow{flex:1;min-width:0}
.nm{font-weight:600;overflow-wrap:anywhere}
.pr{font-size:14px;color:var(--muted)}
.step{display:flex;align-items:center;gap:4px}
.sb{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:26px;line-height:1;padding:0}
.sb.plus{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.q{min-width:34px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.row.on .q{color:var(--accent)}
label.lb{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.field{width:100%;min-height:48px;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.btn{min-height:50px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:44px;padding:0 14px;font-size:15px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45}
.btn.full{width:100%}
.split{display:flex;gap:10px}
.split>*{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.timebox{display:flex;gap:8px;align-items:stretch}
.timebox .field{flex:1;min-width:0}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch{position:relative;flex:none;width:56px;height:32px}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.track{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(24px)}
.switch input:focus-visible + .track{outline:3px solid var(--accent);outline-offset:2px}
.bidainfo{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:15px}
.bidainfo b{font-variant-numeric:tabular-nums}
.install{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.install .grow{flex:1 1 200px}
.install .split{flex:1 1 100%}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.dock>*{max-width:560px;margin:0 auto}
.totalbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.totalbar .lab{font-size:13px;color:var(--muted)}
.totalbar .amt{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px 0}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;padding:0 2px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:10px}
.nav button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:50;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;text-align:center}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:560px;max-height:94%;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.panel h3{margin:0 0 10px;font-size:18px}
.panel ol{margin:6px 0 12px;padding-left:22px}
.panel li{margin:6px 0}
.rc{background:var(--surface);border:1px dashed var(--muted);border-radius:6px;padding:16px;margin-bottom:12px}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.rc-h b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--accent)}
.rc-h span{color:var(--muted);font-size:14px}
.rc-label{padding-top:8px;font-weight:600}
.rl{display:flex;justify-content:space-between;gap:12px;padding:9px 0}
.rl .r{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rl .sub{font-size:13px;color:var(--muted)}
.rc-total{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.rc-foot{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.copyarea{width:100%;min-height:140px;font:14px/1.4 var(--font);padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);margin-bottom:12px}
.daygroup{margin-bottom:6px}
.dayhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:14px 2px 6px;font-weight:600}
.dayhead span{font-size:13px;color:var(--muted);font-weight:500}
.hrow{display:flex;width:100%;align-items:center;gap:10px;min-height:60px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-align:left;margin-bottom:8px}
.card .hrow{background:var(--bg)}
.card .hrow:last-child{margin-bottom:0}
.hrow .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;line-height:1.3}
.hrow .s{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .m{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.pill{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.clock{font-size:42px;font-weight:700;letter-spacing:.02em;line-height:1.1;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.ohead{display:flex;align-items:flex-start;gap:10px}
.osum{font-size:14px;color:var(--muted);margin:10px 0 0;overflow-wrap:anywhere}
.ototal{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:12px 0;font-size:15px;color:var(--muted)}
.ototal b{font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.menubox{margin-top:8px;padding-top:4px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.seg button{min-height:44px;border:0;border-radius:9px;background:none;color:var(--muted);font-size:15px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stats .card{margin:0}
.stats .big{grid-column:1/-1}
.stat-l{font-size:13px;color:var(--muted)}
.stat-v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.big .stat-v{font-size:32px}
.stat-s{font-size:13px;color:var(--muted)}
.pos{color:var(--rev)} .neg{color:var(--bad)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
svg.chart{display:block;width:100%;height:auto}
svg.chart text{fill:var(--muted);font:10.5px var(--font)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .rev{fill:var(--rev)} svg.chart .exp{fill:var(--exp)}
.kv{padding:8px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kvt{display:flex;justify-content:space-between;gap:10px}
.kvt b{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--rev)}
.bar.e i{background:var(--exp)}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.filebtn{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
@media (prefers-reduced-motion: reduce){.track,.track::after{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo Thương Nhớ Quán"><clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath><g clip-path="url(#r)">
  <defs>
    <radialGradient id="glowa" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#7a4528"/>
      <stop offset="1" stop-color="#3d2215"/>
    </radialGradient>
    <linearGradient id="cupa" x1="0" y1="0" x2="0" y2="1">

  </defs>

  <!-- hơi nóng thành hình trái tim -->

        fill="none" stroke="#f6c070" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M196 196 C182 180 200 168 190 150" fill="none" stroke="#f6c070" stroke-width="10" stroke-linecap="round" opacity="0.65"/>
  <path d="M316 196 C330 180 312 168 322 150" fill="none" stroke="#f6c070" stroke-width="10" stroke-linecap="round" opacity="0.65"/>
  <!-- đĩa lót -->
  <ellipse cx="256" cy="394" rx="152" ry="22" fill="#c9a06a"/>
  <ellipse cx="256" cy="388" rx="152" ry="22" fill="#ebcf9f"/>

  <path d="M362 282 H382 C414 282 414 344 380 344 H352" fill="none" stroke="#f0d9b5" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

</g></svg></span>
      <div>
        <div class="brandname" id="shop"></div>
        <div class="eyebrow" id="today"></div>
      </div>
    </div>
    <button class="iconbtn" data-act="settings" aria-label="Cài đặt">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <i class="badge" id="gearBadge" hidden></i>
    </button>
  </header>
  <div class="sync" id="sync" role="status"></div>
  <main id="view"></main>
</div>

  <div id="totalbar" class="totalbar">
    <div><div class="lab">Tổng tiền bill</div><div class="amt" id="totalAmt">0đ</div></div>

    <button data-tab="timer" aria-current="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 3h6"/></svg>Tính giờ</button>
    <button data-tab="bills" aria-current="false"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg>Hóa đơn</button>
    <button data-tab="exp" aria-current="false"><svg viewBox="0 0 24 24"><path d="M12 4v13M7 12l5 5 5-5M5 21h14"/></svg>Chi tiền</button>
    <button data-tab="rep" aria-current="false"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Báo cáo</button>
  </nav>
</div>

<script>
(function(){
"use strict";

/* ===== Bảng giá (sửa tại đây nếu đổi giá) ===== */
var MENU_DEFAULT=[
  {id:"soda",  name:"Nước ngọt",         price:18000},
  {id:"bohuc", name:"Bò húc (Red Bull)", price:25000},
  {id:"cfden", name:"Cà phê đen",        price:18000},
  {id:"cfsua", name:"Cà phê sữa",        price:20000},
  {id:"suoi",  name:"Nước suối",         price:12000}
];
var BIDA={hour:30000, up1:15, add1:5000, up2:35, add2:15000};
var CATS=["Nhập hàng","Điện nước","Mặt bằng","Lương","Khác"];
var DAYS=["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];
var DEFAULT_SHOP="Thương Nhớ Quán";
var KEY={entries:"tnq_entries_v1",cache:"tnq_cache_v1",draft:"tnq_draft_v1",shop:"tnq_shop_v1",backup:"tnq_backup_v1",hide:"tnq_hide_install_v1",menu:"tnq_menu_v1",user:"tnq_user_v1",asked:"tnq_asked_name_v1"};

/* ===== Thực đơn (sửa được trong app) và tên người dùng ===== */
function validMenu(list){
  if(!Array.isArray(list)||list.length>60) return null;
  var out=[];
  for(var i=0;i<list.length;i++){
    var m=list[i];
    if(!m||typeof m.id!=="string"||!/^[A-Za-z0-9_-]{1,60}$/.test(m.id)||typeof m.name!=="string"||typeof m.price!=="number"||!isFinite(m.price)||m.price<0) return null;
    out.push({id:m.id,name:m.name.slice(0,40),price:Math.round(m.price)});
  }
  return out;
}
function cleanMenu(list){
  return list.filter(function(m){return m&&String(m.name).trim()&&isFinite(m.price);}).map(function(m){return {id:m.id,name:String(m.name).trim().slice(0,40),price:Math.max(0,Math.round(m.price))};});
}
var MENU=validMenu(lsGet(KEY.menu,null))||clone(MENU_DEFAULT);
var userName=String(lsGet(KEY.user,"")||"");
function whoText(e){
  var a=e.startBy, z=e.closeBy;
  if(e.startTs){
    if(a&&z) return a+" bấm bắt đầu"+(a===z?" và kết thúc":", "+z+" bấm kết thúc");
    if(a) return a+" bấm bắt đầu";
    if(z) return z+" bấm kết thúc";
    return "";
  }
  return e.by?e.by+" lập bill":"";
}

/* ===== Tiện ích ===== */
function $(s){return document.querySelector(s);}
function pad(n){return n<10?"0"+n:""+n;}
function money(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+"đ";}
function short(n){
  if(n>=1e6) return (+(n/1e6).toFixed(1)+"").replace(".",",")+"tr";
  if(n>=1000) return (+(n/1000).toFixed(1)+"").replace(".",",")+"k";
  return ""+Math.round(n);
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function dayKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function keyToDate(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function fmtDate(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();}
function hm(d){return pad(d.getHours())+":"+pad(d.getMinutes());}
function fmtDT(ts){var d=new Date(ts);return fmtDate(d)+" "+hm(d);}
function fmtDM(ts){var d=new Date(ts);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+" "+hm(d);}
function nowHM(){return hm(new Date());}
function toMin(t){var p=t.split(":");return (+p[0])*60+(+p[1]);}
function diffMin(s,e){var d=toMin(e)-toMin(s);return d<0?d+1440:d;}
function fmtDur(m){
  var h=Math.floor(m/60),r=m%60;
  if(h===0) return r+" phút";
  return r===0?h+" giờ":h+" giờ "+r+" phút";
}
function fmtClock(ms){
  var s=Math.max(0,Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  return pad(h)+":"+pad(m)+":"+pad(s%60);
}
function parseMoney(v){
  var s=String(v||"").trim().toLowerCase().replace(/[.,\s]/g,"");
  var n=parseInt(s,10);
  if(isNaN(n)) return 0;
  if(/tr$/.test(s)) return n*1000000;
  if(/k$/.test(s)) return n*1000;
  return n;
}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function isOpen(e){return e.kind==="bill"&&e.status==="open";}
function isDone(e){return e.kind==="bill"&&e.status!=="open";}
function sumItems(items){return (items||[]).reduce(function(s,i){return s+i.q*i.p;},0);}
function itemsText(items){return (items||[]).map(function(i){return i.q+" "+i.n;}).join(", ");}

/* ===== Tính tiền bida =====
   Dưới 1 giờ vẫn tính 1 giờ. Phần lẻ sau mỗi giờ tròn:
   1-15 phút +5k, 16-35 phút +15k, trên 35 phút tính thêm 1 giờ. */
function calcBida(min){
  min=Math.max(0,Math.floor(min));
  if(min<=60) return {amount:BIDA.hour, detail:"Tối thiểu 1 giờ"};
  var full=Math.floor(min/60), rem=min%60, extra=0, note="";
  if(rem===0){extra=0;}
  else if(rem<=BIDA.up1){extra=BIDA.add1;}
  else if(rem<=BIDA.up2){extra=BIDA.add2;}
  else {extra=BIDA.hour;}
  var base=full*BIDA.hour;
  if(extra>0) note=full+" giờ "+money(base)+" + lố "+rem+" phút "+money(extra);
  else note=full+" giờ";
  return {amount:base+extra, detail:note};
}

function getEntry(id){for(var i=0;i<entries.length;i++){if(entries[i].id===id)return entries[i];}return null;}
function putMemory(e){
  var found=false; entries=entries.map(function(x){if(x.id===e.id){found=true;return e;}return x;});
  if(!found) entries=entries.concat([e]);
}
/* Với Firebase, lệnh ghi hoàn tất ngay trên máy và tự đẩy lên khi có mạng,
   nên không chờ máy chủ trả lời (mất mạng vẫn bấm lưu được). */
function dbWrite(p){
  p.catch(function(){toast("Chưa lưu được, thử lại nhé");});
  return fb?Promise.resolve():p;
}
function putEntry(e,debounce){
  putMemory(e);
  if(!db){persistLocal();return Promise.resolve();}
  if(debounce){
    clearTimeout(wt[e.id]);
    wt[e.id]=setTimeout(function(){dbWrite(db.collection("entries").doc(e.id).set(e));},500);
    return Promise.resolve();
  }
  clearTimeout(wt[e.id]);
  return dbWrite(db.collection("entries").doc(e.id).set(e));
}
function delEntry(id){
  clearTimeout(wt[id]);
  entries=entries.filter(function(e){return e.id!==id;});
  if(db){return dbWrite(db.collection("entries").doc(id).delete());}
  persistLocal(); return Promise.resolve();
}

function needBackup(){

  var last=lsGet(KEY.backup,0);
  if(!last){last=entries.reduce(function(m,e){return Math.min(m,e.ts||m);},Date.now());}
  return Date.now()-last>7*86400000;
}
function setSync(kind){

function stopListen(){unsubs.forEach(function(f){try{f();}catch(e){}});unsubs=[];}
function listen(){

  unsubs.push(db.collection("entries").onSnapshot(function(snap){
    entries=snap.docs.map(function(d){return d.data();});
    lsSet(KEY.cache,entries);
    if(!snap.metadata.fromCache){clearTimeout(loadTimer);setSync("cloud");}
    else if(navigator.onLine===false){clearTimeout(loadTimer);setSync("offline");}
    renderData(); tick();
  },function(){clearTimeout(loadTimer);setSync("slow");}));
  if(db){
    unsubs.push(db.collection("settings").doc("menu").onSnapshot(function(s){
      var d=s.exists?s.data():null, m=d?validMenu(JSON.parse(JSON.stringify(d.items||null))):null;
      if(!m||JSON.stringify(m)===JSON.stringify(MENU)) return;

    },function(){}));

}

async function initFirebase(cfg){
  fbCfg=cfg; mode="cloud"; fb=true;
  entries=lsGet(KEY.cache,[]); setSync("loading");
  var base="https://www.gstatic.com/firebasejs/10.12.2/";
  try{
    await loadScript(base+"firebase-app-compat.js");
    await Promise.all([loadScript(base+"firebase-auth-compat.js"),loadScript(base+"firebase-firestore-compat.js")]);
    firebase.initializeApp(cfg.firebaseConfig);
    try{await firebase.firestore().enablePersistence({synchronizeTabs:true});}catch(e){}
    fbAuth=firebase.auth();
  }catch(e){
    fb=false; mode="local"; entries=lsGet(KEY.entries,[]); setSync("slow");
    toast("Chưa kết nối được máy chủ. Đang dùng số liệu trên máy này.");

  }
  var started=false;
  fbAuth.onAuthStateChanged(function(u){
    if(u){ if(!started){started=true;afterLogin();} }
    else { started=false; stopListen(); showLogin(); }
  });
}
async function initData(){
  var inst=null;

  var cfg=window.TNQ_FIREBASE;
  if(cfg&&cfg.firebaseConfig&&cfg.firebaseConfig.apiKey&&cfg.email){ await initFirebase(cfg); return; }
  mode="local"; entries=lsGet(KEY.entries,[]); setSync("local"); renderData(); tick(); maybeAskName();
}

function restoreFrom(text){

  var list=Array.isArray(obj)?obj:(obj&&obj.entries);
  if(!Array.isArray(list)){toast("Đây không phải file sao lưu của quán");return;}
  var ok=list.filter(function(e){return e&&typeof e.id==="string"&&/^[A-Za-z0-9_-]{1,100}$/.test(e.id)&&(e.kind==="bill"||e.kind==="expense");});
  if(!ok.length){toast("Trong file không có dữ liệu");return;}
  if(obj&&typeof obj.shop==="string"&&obj.shop.trim()){shopName=obj.shop.trim();lsSet(KEY.shop,shopName);applyShop();}
  var rm=obj&&!Array.isArray(obj)?validMenu(obj.menu):null;
  if(rm&&rm.length){MENU=rm;saveMenu(true);}
  var done=function(){toast("Đã khôi phục "+ok.length+" mục");closeSheet();renderData();tick();};
  if(!db){
    var map={}; entries.forEach(function(e){map[e.id]=e;}); ok.forEach(function(e){map[e.id]=e;});
    entries=Object.keys(map).map(function(k){return map[k];}); persistLocal(); done(); return;
  }
  var chain=Promise.resolve();
  ok.forEach(function(e){chain=chain.then(function(){return putEntry(e);});});
  chain.then(done,function(){toast("Khôi phục chưa xong, thử lại nhé");});
}

/* ===== Nháp bill nhập tay ===== */
function calcDraft(){
  var items=MENU.filter(function(m){return (draft.qty[m.id]||0)>0;}).map(function(m){return {k:m.id,n:m.name,q:draft.qty[m.id],p:m.price};});
  var drinks=sumItems(items), other=parseMoney(draft.other), bida=null;
  if(draft.bida&&draft.start){
    var end=draft.end||nowHM(), min=diffMin(draft.start,end), c=calcBida(min);
    bida={start:draft.start,end:end,minutes:min,amount:c.amount,detail:c.detail,tentative:!draft.end};
  }
  return {items:items,drinks:drinks,other:other,otherNote:(draft.otherNote||"").trim(),bida:bida,total:drinks+other+(bida?bida.amount:0)};
}

/* ===== Bàn đang chơi (bill chưa hoàn thành) ===== */
function openCalc(e,now){
  var min=Math.max(0,Math.floor((now-e.startTs)/60000)), c=calcBida(min);
  var drinks=sumItems(e.items), other=e.other||0;

/* ===== Màn hình: Báo cáo ===== */
function periodKeys(p){
  var now=new Date(), keys=[], i, d;
  if(p==="1"){keys.push(dayKey(now));}
  else if(p==="7"){for(i=6;i>=0;i--){d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);keys.push(dayKey(d));}}
  else{for(i=1;i<=now.getDate();i++){keys.push(dayKey(new Date(now.getFullYear(),now.getMonth(),i)));}}
  return keys;
}
function niceMax(v){var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p,m=n<=1?1:n<=2?2:n<=5?5:10;return m*p;}
function chartSVG(days){
  var W=340,H=190,L=40,R=8,T=12,B=24;
  var maxV=1;days.forEach(function(d){maxV=Math.max(maxV,d.rev,d.exp);});
  var top=niceMax(maxV), iw=W-L-R, ih=H-T-B, gw=iw/days.length, bw=Math.min(14,gw*0.36);
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Biểu đồ thu và chi theo ngày">';
  [0,0.5,1].forEach(function(f){
    var y=T+ih-f*ih;
    s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-5)+'" y="'+(y+3.5)+'" text-anchor="end">'+(f===0?"0":short(top*f))+'</text>';
  });
  var step=days.length>14?3:1;
  days.forEach(function(d,i){
    var cx=L+i*gw+gw/2, hr=d.rev/top*ih, he=d.exp/top*ih;
    if(d.rev>0) s+='<rect class="rev" x="'+(cx-bw-1)+'" y="'+(T+ih-Math.max(hr,1.5))+'" width="'+bw+'" height="'+Math.max(hr,1.5)+'" rx="2"/>';
    if(d.exp>0) s+='<rect class="exp" x="'+(cx+1)+'" y="'+(T+ih-Math.max(he,1.5))+'" width="'+bw+'" height="'+Math.max(he,1.5)+'" rx="2"/>';
    if(i%step===0||i===days.length-1){
      s+='<text x="'+cx+'" y="'+(H-7)+'" text-anchor="middle">'+d.label+'</text>';
    }
  });
  return s+'</svg>';
}
function renderRep(){
  var keys=periodKeys(state.period);
  var set={};keys.forEach(function(k){set[k]=1;});
  var bills=entries.filter(function(e){return isDone(e)&&set[e.day];});
  var exps=entries.filter(function(e){return e.kind==="expense"&&set[e.day];});
  var rev=bills.reduce(function(s,b){return s+b.total;},0);
  var exp=exps.reduce(function(s,e){return s+e.amount;},0);
  var profit=rev-exp;
  var drinks=0,bida=0,other=0,mins=0,sold={};
  bills.forEach(function(b){
    drinks+=b.drinks||0; other+=b.other||0;
    if(b.bida){bida+=b.bida.amount;mins+=b.bida.minutes;}
    (b.items||[]).forEach(function(i){sold[i.n]=(sold[i.n]||0)+i.q;});
  });
  var byCat={};exps.forEach(function(e){byCat[e.cat]=(byCat[e.cat]||0)+e.amount;});

  var chartKeys=state.period==="1"?periodKeys("7"):keys;
  var cset={};chartKeys.forEach(function(k){cset[k]={rev:0,exp:0};});
  entries.forEach(function(e){var t=cset[e.day];if(!t)return;if(isDone(e))t.rev+=e.total;else if(e.kind==="expense")t.exp+=e.amount;});
  var cdays=chartKeys.map(function(k){var d=keyToDate(k);return {rev:cset[k].rev,exp:cset[k].exp,label:state.period==="30"?""+d.getDate():pad(d.getDate())+"/"+pad(d.getMonth()+1)};});
  var chartHas=cdays.some(function(d){return d.rev>0||d.exp>0;});
  var chartTitle=state.period==="30"?"Thu chi theo ngày trong tháng":"Thu chi 7 ngày gần nhất";

  var h='<div class="seg" role="group" aria-label="Khoảng thời gian">'
    +[["1","Hôm nay"],["7","7 ngày"],["30","Tháng này"]].map(function(p){return '<button data-act="period" data-p="'+p[0]+'" aria-pressed="'+(state.period===p[0])+'">'+p[1]+'</button>';}).join("")+'</div>';
  h+='<div class="stats"><div class="card big"><div class="stat-l">Lãi (thu trừ chi)</div><div class="stat-v '+(profit<0?'neg':'pos')+'">'+(profit<0?"−":"")+money(Math.abs(profit))+'</div></div>'
    +'<div class="card"><div class="stat-l">Doanh thu</div><div class="stat-v">'+money(rev)+'</div><div class="stat-s">'+bills.length+' hóa đơn</div></div>'
    +'<div class="card"><div class="stat-l">Tổng chi</div><div class="stat-v">'+money(exp)+'</div><div class="stat-s">'+exps.length+' khoản</div></div></div>';

  h+='<section class="card"><h2>'+chartTitle+'</h2>';
  if(chartHas){
    h+=chartSVG(cdays)+'<div class="legend"><span><i style="background:var(--rev)"></i>Thu</span><span><i style="background:var(--exp)"></i>Chi</span></div>';
  }else{
    h+='<div class="empty"><b>Chưa có số liệu</b>Lưu hóa đơn hoặc ghi khoản chi, biểu đồ sẽ hiện ở đây.</div>';
  }
  h+='</section>';

  if(rev>0){
    var src=[["Đồ uống",drinks],["Bida",bida],["Khác",other]];
    h+='<section class="card"><h2>Doanh thu theo nguồn</h2>';
    src.forEach(function(x){
      var pc=rev?Math.round(x[1]/rev*100):0;
      h+='<div class="kv"><div class="kvt"><span>'+x[0]+(x[0]==="Bida"&&mins?' · '+fmtDur(mins):'')+'</span><b>'+money(x[1])+'</b></div><div class="bar"><i style="width:'+pc+'%"></i></div></div>';
    });
    h+='</section>';
    var names=Object.keys(sold).sort(function(a,b){return sold[b]-sold[a];});
    if(names.length){
      h+='<section class="card"><h2>Bán được</h2>';
      names.forEach(function(n){h+='<div class="kv"><div class="kvt"><span>'+esc(n)+'</span><b>'+sold[n]+'</b></div></div>';});
      h+='</section>';
    }
  }
  var cats=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];});
  if(cats.length){
    h+='<section class="card"><h2>Chi theo loại</h2>';
    cats.forEach(function(c){
      var pc=exp?Math.round(byCat[c]/exp*100):0;
      h+='<div class="kv"><div class="kvt"><span>'+esc(c)+'</span><b>'+money(byCat[c])+'</b></div><div class="bar e"><i style="width:'+pc+'%"></i></div></div>';
    });
    h+='</section>';
  }
  $("#view").innerHTML=h;
}

/* ===== Cập nhật theo giây (đồng hồ, tạm tính) ===== */
function setT(sel,txt){var el=document.querySelector(sel);if(el&&el.textContent!==txt)el.textContent=txt;}
function tick(){
  var now=Date.now();
  if(state.tab==="timer"||state.tab==="bills"){
    entries.forEach(function(e){
      if(!isOpen(e)) return;
      var c=openCalc(e,now), id=e.id;
      setT('[data-clock="'+id+'"]',fmtClock(now-e.startTs));
      setT('[data-rowclock="'+id+'"]',fmtClock(now-e.startTs));
      setT('[data-rowtotal="'+id+'"]',money(c.total));
      setT('[data-tmin="'+id+'"]',"Tổng giờ chơi: "+fmtDur(c.minutes));
      setT('[data-tbida="'+id+'"]',money(c.bida));
      setT('[data-tdetail="'+id+'"]',c.detail);
      setT('[data-ttotal="'+id+'"]',money(c.total));
      var sum=itemsText(e.items); if(e.other>0) sum+=(sum?", ":"")+"Khác "+money(e.other);
      setT('[data-tsum="'+id+'"]',sum?"Đã gọi: "+sum:"Chưa gọi đồ uống.");
      MENU.forEach(function(m){
        var it=(e.items||[]).filter(function(i){return i.k===m.id;})[0], q=it?it.q:0;
        setT("#oq-"+id+"-"+m.id,""+q);
        var row=document.getElementById("orow-"+id+"-"+m.id); if(row) row.classList.toggle("on",q>0);
      });
    });
  }
  if(state.tab==="sell"&&draft.bida&&draft.start&&!draft.end&&Math.floor(now/1000)%30===0) updateSell();
}

function renderData(){

  if(state.tab==="bills") renderBills();
  else if(state.tab==="rep") renderRep();
  else if(state.tab==="timer"&&!typing) renderTimer();
  else if(state.tab==="exp"&&!typing) renderExp();
}
function go(tab){
  state.tab=tab; state.open=null; state.confirm=null;
  var btns=document.querySelectorAll("#nav button");
  for(var i=0;i<btns.length;i++) btns[i].setAttribute("aria-current",btns[i].dataset.tab===tab?"true":"false");
  $("#totalbar").hidden=(tab!=="sell");
  if(tab==="sell") renderSell();
  else if(tab==="timer") renderTimer();
  else if(tab==="bills") renderBills();
  else if(tab==="exp") renderExp();
  else renderRep();
  window.scrollTo(0,0);
}

/* ===== Bảng hiện lên (hóa đơn, cài đặt, hướng dẫn) ===== */
function openSheet(kind,html){state.sheet=kind;$("#panel").innerHTML=html;$("#panel").setAttribute("aria-label",{receipt:"Hóa đơn",settings:"Cài đặt",menu:"Thực đơn và giá",name:"Tên của bạn"}[kind]||"Hướng dẫn");$("#sheet").hidden=false;}
function closeSheet(){
  var k=state.sheet;
  $("#sheet").hidden=true;state.sheet=null;state.pending=null;
  if(k==="menu") menuClosed();
}
var menuTimer=null;
function saveMenu(now){
  lsSet(KEY.menu,MENU);
  if(!db) return;
  clearTimeout(menuTimer);
  var send=function(){dbWrite(db.collection("settings").doc("menu").set({items:cleanMenu(MENU)}));};
  if(now) send(); else menuTimer=setTimeout(send,700);
}
function menuClosed(){
  MENU=cleanMenu(MENU); saveMenu(true);
  if(state.tab==="sell") renderSell(); else if(state.tab==="timer") renderTimer();
}
function showMenu(){
  var h='<h3>Thực đơn và giá</h3><p class="hint" style="margin:0 0 10px">Đổi ở một máy thì các máy khác cũng đổi theo. Bill cũ giữ nguyên giá lúc bán.</p>';
  MENU.forEach(function(m,i){
    var armed=state.confirm==="m"+i;
    h+='<div class="card"><label class="lb" style="margin-top:0" for="mn-'+i+'">Tên món</label><input class="field" id="mn-'+i+'" data-mname="'+i+'" autocomplete="off" value="'+esc(m.name)+'">'
      +'<label class="lb" for="mp-'+i+'">Giá (đồng)</label><div class="timebox"><input class="field num" id="mp-'+i+'" data-mprice="'+i+'" inputmode="numeric" autocomplete="off" value="'+m.price+'">'
      +'<button class="btn small'+(armed?' danger':'')+'" data-act="delMenu" data-i="'+i+'">'+(armed?'Bấm lại để xoá':'Xoá món')+'</button></div></div>';
  });
  if(!MENU.length) h+='<div class="pr" style="margin-bottom:10px">Chưa có món nào. Bấm “Thêm món”.</div>';
  h+='<button class="btn full" data-act="addMenu">+ Thêm món</button><div style="height:10px"></div><button class="btn primary full" data-act="closeSheet">Xong</button>';
  openSheet("menu",h);
}
function showNameAsk(){
  lsSet(KEY.asked,true);
  openSheet("name",'<h3>Bạn tên gì?</h3><p class="pr" style="margin:0 0 8px">Tên này được ghi lại ở mỗi bill và khoản chi bạn bấm, để cả quán biết ai đã làm. Mỗi điện thoại nhập một lần, đổi lại ở Cài đặt.</p>'
    +'<label class="lb" for="askName">Tên của bạn</label><input class="field" id="askName" autocomplete="off" placeholder="VD: Lan">'
    +'<div style="height:12px"></div><div class="split"><button class="btn" data-act="closeSheet">Để sau</button><button class="btn primary" data-act="saveName">Lưu tên</button></div>');
}
function maybeAskName(){if(!userName&&!lsGet(KEY.asked,false)) showNameAsk();}
function openReceipt(entry,backLabel){
  state.pending=entry;
  var m=receiptModel(entry);
  openSheet("receipt",'<h3>Hóa đơn</h3>'+receiptHTML(m)+'<div id="copybox"></div>'
    +'<div class="split"><button class="btn" data-act="closeSheet">'+(backLabel||"Quay lại")+'</button><button class="btn" data-act="sheetCopy">Sao chép</button></div>'
    +'<div style="height:10px"></div><button class="btn primary full" data-act="sheetSave">Lưu bill '+money(entry.total)+'</button>');
}

/* ===== Sự kiện ===== */
document.addEventListener("click",function(ev){
  var tabBtn=ev.target.closest("[data-tab]");
  if(tabBtn){go(tabBtn.dataset.tab);return;}
  var b=ev.target.closest("[data-act]");
  if(!b) return;
  var act=b.dataset.act, id=b.dataset.id;

  if(act==="inc"||act==="dec"){
    var q=(draft.qty[id]||0)+(act==="inc"?1:-1); if(q<0)q=0; if(q>99)q=99;
    draft.qty[id]=q; saveDraft();
    $("#q-"+id).textContent=q; $("#row-"+id).classList.toggle("on",q>0); updateSell();
  }
  else if(act==="nowStart"){draft.start=nowHM();$("#start").value=draft.start;saveDraft();updateSell();}
  else if(act==="nowEnd"){draft.end=nowHM();$("#end").value=draft.end;saveDraft();updateSell();}
  else if(act==="reset"){
    if(state.confirm==="reset"){draft={qty:{},other:"",otherNote:"",bida:false,start:"",end:""};saveDraft();state.confirm=null;renderSell();toast("Đã xoá bill đang nhập");}
    else{state.confirm="reset";b.textContent="Bấm lại để xoá hết";b.classList.add("danger");setTimeout(function(){if(state.confirm==="reset"){state.confirm=null;if(state.tab==="sell")renderSell();}},3500);}
  }
  else if(act==="calc"){
    if(draft.bida&&!draft.start){toast("Chưa có giờ bắt đầu bida");return;}
    if(draft.bida&&!draft.end){draft.end=nowHM();var ei=$("#end");if(ei)ei.value=draft.end;saveDraft();}
    var c=calcDraft();
    if(c.total<=0){toast("Bill chưa có món nào");return;}
    var now=Date.now();
    openReceipt({id:newId("b"),kind:"bill",status:"done",by:userName,ts:now,closedTs:now,day:dayKey(new Date(now)),items:c.items,drinks:c.drinks,other:c.other,otherNote:c.otherNote,bida:c.bida?{start:c.bida.start,end:c.bida.end,minutes:c.bida.minutes,amount:c.bida.amount,detail:c.bida.detail}:null,total:c.total},"Quay lại sửa");
  }
  else if(act==="closeSheet"){closeSheet();}
  else if(act==="sheetCopy"){var t=receiptText(receiptModel(state.pending));copyText(t,function(){showCopyFallback(t);});}
  else if(act==="sheetSave"){
    var e=state.pending; if(!e) return;
    var wasOpen=!!e.startTs;
    if(wasOpen){
      var cur=getEntry(e.id);
      if(!cur||!isOpen(cur)){toast("Bàn này đã được tính tiền hoặc huỷ ở máy khác");closeSheet();renderData();return;}
    }
    b.disabled=true;
    putEntry(e).then(function(){
      if(!wasOpen){draft={qty:{},other:"",otherNote:"",bida:false,start:"",end:""};saveDraft();}
      closeSheet(); toast("Đã lưu bill "+money(e.total));
      if(state.tab==="sell") renderSell(); else renderData();
    },function(){b.disabled=false;toast("Không lưu được, thử lại nhé");});
  }
  else if(act==="startTimer"){
    var lab=($("#newLabel").value||"").trim();
    startTimer(lab).then(function(){toast("Đã bắt đầu tính giờ");renderTimer();},function(){toast("Không lưu được, thử lại nhé");});
  }
  else if(act==="toggleMenu"){state.menuOpen[id]=!state.menuOpen[id];var mb=$("#mb-"+id);mb.hidden=!state.menuOpen[id];b.textContent=state.menuOpen[id]?"Ẩn danh sách đồ":"Gọi thêm đồ uống, tiền khác";b.setAttribute("aria-expanded",state.menuOpen[id]?"true":"false");}
  else if(act==="oinc"||act==="odec"){
    var k=b.dataset.k;
    editOpen(id,function(x){
      var it=x.items.filter(function(i){return i.k===k;})[0];
      if(!it){var m=MENU.filter(function(z){return z.id===k;})[0];if(!m)return;it={k:m.id,n:m.name,q:0,p:m.price};x.items.push(it);}
      it.q=Math.max(0,Math.min(99,it.q+(act==="oinc"?1:-1)));
      x.items=x.items.filter(function(i){return i.q>0;});
    });
  }
  else if(act==="finish"){
    var eo=getEntry(id); if(!eo||!isOpen(eo)) return;
    openReceipt(closeOpen(eo,Date.now()),"Quay lại (bàn vẫn tính giờ)");
  }
  else if(act==="cancelOpen"){
    if(state.confirm===id){state.confirm=null;delEntry(id).then(function(){toast("Đã huỷ bill");renderTimer();});}
    else{state.confirm=id;b.textContent="Bấm lại để huỷ";setTimeout(function(){if(state.confirm===id){state.confirm=null;if(state.tab==="timer"&&!(document.activeElement&&document.activeElement.tagName==="INPUT"))renderTimer();}},3500);}
  }
  else if(act==="gotoOpen"){go("timer");var card=document.getElementById("oc-"+id);if(card)card.scrollIntoView();}
  else if(act==="toggle"){state.open=(state.open===id)?null:id;state.confirm=null;renderBills();}
  else if(act==="copyEntry"){
    var en=getEntry(id); if(!en) return;
    var tx=receiptText(receiptModel(en)); copyText(tx,function(){showCopyFallback(tx);});
  }
  else if(act==="del"){
    if(state.confirm===id){
      state.confirm=null;
      delEntry(id).then(function(){toast("Đã xoá");state.open=null;if(state.tab==="exp")renderExp();else renderData();},function(){toast("Không xoá được, thử lại nhé");});
    }else{
      state.confirm=id; if(state.tab==="bills")renderBills(); else renderExp();
      setTimeout(function(){if(state.confirm===id){state.confirm=null;if(state.tab==="bills")renderBills();else if(state.tab==="exp"&&document.activeElement.tagName!=="INPUT")renderExp();}},3500);
    }
  }
  else if(act==="moreHist"){state.histDays+=14;renderBills();}
  else if(act==="cat"){
    state.cat=b.dataset.cat;
    var chips=document.querySelectorAll(".chip");
    for(var i=0;i<chips.length;i++) chips[i].setAttribute("aria-pressed",chips[i].dataset.cat===state.cat?"true":"false");
  }
  else if(act==="saveExp"){
    var amt=parseMoney($("#expAmt").value), day=$("#expDate").value||dayKey(new Date());
    if(amt<=0){toast("Nhập số tiền chi");return;}
    var ex={id:newId("e"),kind:"expense",by:userName,ts:Date.now(),day:day,amount:amt,cat:state.cat,note:$("#expNote").value.trim()};
    b.disabled=true;
    putEntry(ex).then(function(){toast("Đã lưu khoản chi "+money(amt));renderExp();},function(){b.disabled=false;toast("Không lưu được, thử lại nhé");});
  }
  else if(act==="period"){state.period=b.dataset.p;renderRep();}
  else if(act==="settings"){showSettings();}
  else if(act==="install"){doInstall();}
  else if(act==="hideInstall"){lsSet(KEY.hide,true);renderSell();}
  else if(act==="backup"){downloadBackup();}
  else if(act==="shareBackup"){shareBackup();}
  else if(act==="editMenu"){showMenu();}
  else if(act==="addMenu"){
    MENU.push({id:newId("m"),name:"",price:0}); saveMenu(false); showMenu();
    var ni=document.getElementById("mn-"+(MENU.length-1)); if(ni) ni.focus();
  }
  else if(act==="delMenu"){
    var di=+b.dataset.i;
    if(state.confirm==="m"+di){state.confirm=null;MENU.splice(di,1);saveMenu(true);showMenu();}
    else{
      state.confirm="m"+di; showMenu();
      setTimeout(function(){if(state.confirm==="m"+di){state.confirm=null;var ae=document.activeElement;if(state.sheet==="menu"&&!(ae&&ae.tagName==="INPUT"))showMenu();}},3500);
    }
  }
  else if(act==="saveName"){
    var nv=(($("#askName")||{}).value||"").trim().slice(0,20);
    if(!nv){toast("Nhập tên của bạn");return;}
    userName=nv; lsSet(KEY.user,userName); closeSheet(); toast("Xin chào "+nv);
  }
  else if(act==="login"){doLogin();}
  else if(act==="logout"){
    closeSheet();
    if(fbAuth) fbAuth.signOut().then(function(){entries=[];lsSet(KEY.cache,[]);},function(){});
  }
  else if(act==="uploadLocal"){
    var old=lsGet(KEY.entries,[]), chain=Promise.resolve();
    old.forEach(function(e){chain=chain.then(function(){return putEntry(e);});});
    chain.then(function(){lsSet(KEY.entries,[]);toast("Đã đưa "+old.length+" mục lên dùng chung");closeSheet();renderData();},function(){toast("Chưa đưa lên được, thử lại nhé");});
  }
});
function doLogin(){
  var pw=($("#pw")||{}).value||"";
  if(!pw){toast("Nhập mật khẩu của quán");return;}
  if(!fbAuth||!fbCfg) return;
  fbAuth.signInWithEmailAndPassword(fbCfg.email,pw).catch(function(err){
    var c=err&&err.code||"";
    showLogin(/network/.test(c)?"Không có mạng, thử lại khi có mạng.":"Sai mật khẩu, thử lại nhé.");
  });
}
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target&&ev.target.id==="pw"){ev.preventDefault();doLogin();}
});

document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="other"){draft.other=t.value;saveDraft();updateSell();}
  else if(t.id==="otherNote"){draft.otherNote=t.value;saveDraft();}
  else if(t.id==="start"){draft.start=t.value;saveDraft();updateSell();}
  else if(t.id==="end"){draft.end=t.value;saveDraft();updateSell();}
  else if(t.id==="shopName"){
    shopName=t.value.trim()||DEFAULT_SHOP;lsSet(KEY.shop,shopName);applyShop();
    if(db){clearTimeout(shopTimer);var nm=shopName;shopTimer=setTimeout(function(){db.collection("settings").doc("main").set({shop:nm}).catch(function(){});},700);}
  }
  else if(t.id==="userName"){userName=t.value.trim().slice(0,20);lsSet(KEY.user,userName);}
  else if(t.dataset&&t.dataset.mname!==undefined){var mi=MENU[+t.dataset.mname];if(mi){mi.name=t.value;saveMenu(false);}}
  else if(t.dataset&&t.dataset.mprice!==undefined){var mj=MENU[+t.dataset.mprice];if(mj){mj.price=parseMoney(t.value);saveMenu(false);}}
  else if(t.dataset&&t.dataset.oother){var v=t.value;editOpen(t.dataset.oother,function(x){x.other=parseMoney(v);});}
  else if(t.dataset&&t.dataset.onote){var n=t.value;editOpen(t.dataset.onote,function(x){x.otherNote=n;});}
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="bidaOn"){
    draft.bida=t.checked;saveDraft();
    $("#bidaBox").hidden=!draft.bida;updateSell();
  }
  else if(t.dataset&&t.dataset.start){
    var val=t.value; if(!val) return;
    editOpen(t.dataset.start,function(x){
      var d=new Date(), p=val.split(":");
      d.setHours(+p[0],+p[1],0,0);
      if(d.getTime()>Date.now()) d=new Date(d.getTime()-86400000);
      x.startTs=d.getTime(); x.ts=x.startTs; x.openedTs=x.startTs;
    });
  }
  else if(t.id==="restoreFile"&&t.files&&t.files[0]){
    var r=new FileReader();
    r.onload=function(){restoreFrom(String(r.result));};
    r.onerror=function(){toast("Không đọc được file");};
    r.readAsText(t.files[0]);
  }
});
$("#sheet").addEventListener("click",function(ev){if(ev.target.id==="sheet")closeSheet();});

window.addEventListener("beforeinstallprompt",function(ev){ev.preventDefault();deferredPrompt=ev;});
window.addEventListener("appinstalled",function(){deferredPrompt=null;lsSet(KEY.hide,true);toast("Đã cài ThuongNhoQuan");if(state.tab==="sell")renderSell();});

setInterval(tick,1000);

/* ===== Khởi động ===== */
var nd=new Date();
$("#today").textContent=DAYS[nd.getDay()]+", "+fmtDate(nd);
applyShop();
setSync("local");
go("sell");
initData();

if("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.claude){
  window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){});});
}
})();
</script>
