<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f1e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1410" media="(prefers-color-scheme: dark)">
<meta name="description" content="Quản lý bill nước, tính giờ bida, thu chi và lãi cho quán Thương Nhớ Quán.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ThuongNhoQuan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html,body{margin:0}html{padding-top:env(safe-area-inset-top,0px)}</style>
<title>ThuongNhoQuan</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Pacifico&display=swap">
<style>
/* Bố cục: một cột, ngón cái với tới, thanh tổng tiền và thanh tab dính đáy.
   Màu: nâu cà phê và kem ấm, xanh nỉ bàn bida cho tiền thu, cam cho tiền chi. */
:root{
  --bg:#f8f1e6; --surface:#fffaf2; --ink:#3a2418; --muted:#7a6454; --line:#e6d8c3;
  --accent:#7b4a2d; --accent-ink:#fff8ee; --accent-soft:#f3e4cf;
  --rev:#2d7a50; --exp:#c0701c; --bad:#b83a2c; --long:#d9731a; --long-ink:#fff; --bank:#2a6f9e; --bank-ink:#fff;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Pacifico","Be Vietnam Pro",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1410; --surface:#2a1e18; --ink:#f4e8d8; --muted:#b9a38f; --line:#43322a;
    --accent:#e9aa5c; --accent-ink:#2a1608; --accent-soft:#3b2b20;
    --rev:#6fcf97; --exp:#f0a14f; --bad:#ff8272; --long:#f0a14f; --long-ink:#2a1608; --bank:#7bb8ea; --bank-ink:#0e2438; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1410; --surface:#2a1e18; --ink:#f4e8d8; --muted:#b9a38f; --line:#43322a;
  --accent:#e9aa5c; --accent-ink:#2a1608; --accent-soft:#3b2b20;
  --rev:#6fcf97; --exp:#f0a14f; --bad:#ff8272; --long:#f0a14f; --long-ink:#2a1608; --bank:#7bb8ea; --bank-ink:#0e2438; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font:16px/1.45 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:210px; -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:560px;margin:0 auto}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0 4px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo svg{display:block;width:52px;height:52px;border-radius:14px;flex:none}
.brandname{font-family:var(--display);font-size:23px;line-height:1.2;color:var(--accent);overflow-wrap:anywhere}
.eyebrow{font-size:13px;color:var(--muted)}
.iconbtn{position:relative;flex:none;width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0}
.iconbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:7px;right:7px;width:11px;height:11px;border-radius:50%;background:var(--exp);border:2px solid var(--surface)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:2px 0 12px}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--rev)}
.dot.warn{background:var(--exp)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.grow{flex:1;min-width:0}
.nm{font-weight:600;overflow-wrap:anywhere}
.pr{font-size:14px;color:var(--muted)}
.step{display:flex;align-items:center;gap:4px}
.sb{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:26px;line-height:1;padding:0}
.sb.plus{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.q{min-width:34px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.row.on .q{color:var(--accent)}
label.lb{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.field{width:100%;min-height:48px;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.btn{min-height:50px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:44px;padding:0 14px;font-size:15px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45}
.btn.full{width:100%}
.split{display:flex;gap:10px}
.split>*{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.timebox{display:flex;gap:8px;align-items:stretch}
.timebox .field{flex:1;min-width:0}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch{position:relative;flex:none;width:56px;height:32px}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.track{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(24px)}
.switch input:focus-visible + .track{outline:3px solid var(--accent);outline-offset:2px}
.bidainfo{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:15px}
.bidainfo b{font-variant-numeric:tabular-nums}
.install{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.install .grow{flex:1 1 200px}
.install .split{flex:1 1 100%}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.dock>*{max-width:560px;margin:0 auto}
.totalbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.totalbar .lab{font-size:13px;color:var(--muted)}
.totalbar .amt{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px 0}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:0 2px;border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;border-radius:10px}
.nav button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toast{display:flex;align-items:center;gap:12px;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:50;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;text-align:center}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:560px;max-height:94%;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.panel h3{margin:0 0 10px;font-size:18px}
.panel ol{margin:6px 0 12px;padding-left:22px}
.panel li{margin:6px 0}
.rc{background:var(--surface);border:1px dashed var(--muted);border-radius:6px;padding:16px;margin-bottom:12px}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.rc-h b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--accent)}
.rc-h span{color:var(--muted);font-size:14px}
.rc-label{padding-top:8px;font-weight:600}
.rl{display:flex;justify-content:space-between;gap:12px;padding:9px 0}
.rl .r{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rl .sub{font-size:13px;color:var(--muted)}
.rc-total{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.rc-foot{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.copyarea{width:100%;min-height:140px;font:14px/1.4 var(--font);padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);margin-bottom:12px}
.daygroup{margin-bottom:6px}
.dayhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:14px 2px 6px;font-weight:600}
.dayhead span{font-size:13px;color:var(--muted);font-weight:500}
.hrow{display:flex;width:100%;align-items:center;gap:10px;min-height:60px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-align:left;margin-bottom:8px}
.card .hrow{background:var(--bg)}
.card .hrow:last-child{margin-bottom:0}
.hrow .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;line-height:1.3}
.hrow .s{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .m{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.pill{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.clock{font-size:42px;font-weight:700;letter-spacing:.02em;line-height:1.1;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.ohead{display:flex;align-items:flex-start;gap:10px}
.osum{font-size:14px;color:var(--muted);margin:10px 0 0;overflow-wrap:anywhere}
.ototal{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:12px 0;font-size:15px;color:var(--muted)}
.ototal b{font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.menubox{margin-top:8px;padding-top:4px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.seg button{min-height:44px;border:0;border-radius:9px;background:none;color:var(--muted);font-size:15px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stats .card{margin:0}
.stats .big{grid-column:1/-1}
.stat-l{font-size:13px;color:var(--muted)}
.stat-v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.big .stat-v{font-size:32px}
.stat-s{font-size:13px;color:var(--muted)}
.pos{color:var(--rev)} .neg{color:var(--bad)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
svg.chart{display:block;width:100%;height:auto}
svg.chart text{fill:var(--muted);font:10.5px var(--font)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .rev{fill:var(--rev)} svg.chart .exp{fill:var(--exp)}
.kv{padding:8px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kvt{display:flex;justify-content:space-between;gap:10px}
.kvt b{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--rev)}
.bar.e i{background:var(--exp)}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.filebtn{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:76px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-size:23px;font-weight:700;margin:6px 0 10px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.bigbtn svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.bigbtn:active{transform:translateY(1px)}
.tcard{padding:16px}
.qrthumb{display:block;width:140px;height:140px;object-fit:contain;background:#fff;border-radius:8px;margin:0 auto 10px}
.qrbig{display:block;width:min(100%,340px);height:auto;margin:8px auto 14px;background:#fff;border-radius:12px;padding:8px}
.btn.bank{background:var(--bank);border-color:var(--bank);color:var(--bank-ink);font-weight:700}
.payhint{text-align:center;font-weight:700;font-size:18px;margin:4px 0 10px}
.btn.cash{font-weight:700}
.askq{font-size:22px;font-weight:700;text-align:center;margin:8px 4px 20px;line-height:1.35}
.eslot{display:flex;align-items:center;gap:12px;padding:10px 14px}
.eslot .tname{font-size:20px}
.eslot .btn{flex:none;min-height:52px;font-size:17px;font-weight:700}
.sechead{font-size:14px;font-weight:700;color:var(--muted);margin:14px 4px 8px;letter-spacing:.02em}
.tname{font-size:22px;font-weight:700;overflow-wrap:anywhere}
.tcard .clock{font-size:52px;text-align:center;margin:12px 0 8px}
.tcard.long{border:2px solid var(--long)}
.tcard.long .pill{background:var(--long);color:var(--long-ink)}
.btn.lg{min-height:60px;font-size:18px}
.btn.pop{min-height:58px;font-size:18px;font-weight:700;background:#f6b94f;border-color:#e39a1f;color:#3a2418;margin-bottom:12px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.pop:active{transform:translateY(1px)}
.tact{margin:12px 0}
.minirow{display:flex;gap:8px;margin-top:10px}
.minirow .btn{flex:1;min-width:0;min-height:46px;font-size:14px;padding:0 6px;background:var(--bg)}
.minirow .btn.danger{background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.billimg{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--line);margin-bottom:12px}
.center{text-align:center}
.warnbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.25);margin:0 0 12px;border-radius:12px;background:var(--long);color:var(--long-ink);padding:12px 14px;font-size:17px;font-weight:700}
.warnbar .w{margin-bottom:10px;line-height:1.35}
.warnbar .w:last-child{margin-bottom:0}
.warnbar .wb{display:flex;gap:8px;margin-top:8px}
.warnbar button{flex:1;min-height:48px;border-radius:10px;border:2px solid currentColor;background:transparent;color:inherit;font-size:16px;font-weight:700}
.updbar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700}
.updbar button{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--accent-ink);color:var(--accent);font-size:16px;font-weight:700}
.toast{width:max-content;max-width:calc(100vw - 32px);font-size:14px;line-height:1.3;padding:8px 8px 8px 14px;gap:10px;bottom:calc(var(--dockh,72px) + 8px + env(safe-area-inset-bottom,0px))}
.toast button{flex:none;min-height:32px;padding:0 10px;border-radius:8px;border:0;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700}
.tpick{display:flex;flex-direction:column;gap:8px;margin:2px 0 4px}
.trow{display:flex;align-items:center;gap:8px}
.trow .sb{width:56px;height:56px}
.tval{width:72px;min-height:56px;text-align:center;font:700 32px var(--font);font-variant-numeric:tabular-nums;border:2px dashed var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:0}
.tval:focus{border-style:solid;border-color:var(--accent);outline:none}
.tlab{color:var(--muted);font-size:15px;min-width:42px}
html.bigtext .wrap,html.bigtext .dock,html.bigtext .panel{zoom:1.22}
html.bigtext .toast{font-size:16px}
html.bigtext body{padding-bottom:320px}
@media (prefers-reduced-motion: reduce){.track,.track::after{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo Thương Nhớ Quán"><clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath><g clip-path="url(#r)">
  <defs>
    <radialGradient id="glowa" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#7a4528"/>
      <stop offset="1" stop-color="#3d2215"/>
    </radialGradient>
    <linearGradient id="cupa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="1" stop-color="#f0d9b5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#glowa)"/>
  <circle cx="256" cy="238" r="158" fill="#f3b05a" opacity="0.20"/>
  <circle cx="256" cy="238" r="112" fill="#f3b05a" opacity="0.14"/>
  <!-- hơi nóng thành hình trái tim -->
  <path d="M256 214 C198 176 190 132 226 120 C244 114 256 128 256 140 C256 128 268 114 286 120 C322 132 314 176 256 214 Z"
        fill="none" stroke="#f6c070" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M196 196 C182 180 200 168 190 150" fill="none" stroke="#f6c070" stroke-width="10" stroke-linecap="round" opacity="0.65"/>
  <path d="M316 196 C330 180 312 168 322 150" fill="none" stroke="#f6c070" stroke-width="10" stroke-linecap="round" opacity="0.65"/>
  <!-- đĩa lót -->
  <ellipse cx="256" cy="394" rx="152" ry="22" fill="#c9a06a"/>
  <ellipse cx="256" cy="388" rx="152" ry="22" fill="#ebcf9f"/>
  <!-- tay cầm -->
  <path d="M362 282 H382 C414 282 414 344 380 344 H352" fill="none" stroke="#f0d9b5" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- thân ly -->
  <path d="M146 258 H366 V300 C366 346 334 384 290 384 H222 C178 384 146 346 146 300 Z" fill="url(#cupa)"/>
  <ellipse cx="256" cy="258" rx="110" ry="17" fill="#fff6e6"/>
  <ellipse cx="256" cy="260" rx="96" ry="12" fill="#6a3a1d"/>
  <!-- bi-a nhỏ bên đĩa -->

<script>
(function(){
"use strict";

/* ===== Bảng giá (sửa tại đây nếu đổi giá) ===== */
var MENU_DEFAULT=[
  {id:"soda",  name:"Nước ngọt",         price:18000},
  {id:"bohuc", name:"Bò húc (Red Bull)", price:25000},
  {id:"cfden", name:"Cà phê đen",        price:18000},
  {id:"cfsua", name:"Cà phê sữa",        price:20000},
  {id:"suoi",  name:"Nước suối",         price:12000}
];
var BIDA_TYPES={
  bang:{label:"Bida băng",hour:30000,up1:15,add1:5000,up2:35,add2:15000},
  lo:{label:"Bida lỗ",hour:35000,up1:15,add1:5000,up2:35,add2:15000}
};
/* Bàn của quán: mỗi bàn một ô cố định. Sửa tên hoặc thêm bàn ở đây, rồi tăng số CACHE trong sw.js. */
var TABLES=[
  {id:"b1",name:"Băng 1",type:"bang"},
  {id:"b2",name:"Băng 2",type:"bang"},
  {id:"b3",name:"Băng 3",type:"bang"},
  {id:"l1",name:"Lỗ 1",type:"lo"}
];
function tableOf(id){for(var i=0;i<TABLES.length;i++){if(TABLES[i].id===id)return TABLES[i];}return null;}
var CATS=["Nhập hàng","Điện nước","Mặt bằng","Lương","Khác"];
var DAYS=["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];
var DEFAULT_SHOP="Thương Nhớ Quán";
var KEY={entries:"tnq_entries_v1",cache:"tnq_cache_v1",draft:"tnq_draft_v1",shop:"tnq_shop_v1",backup:"tnq_backup_v1",hide:"tnq_hide_install_v1",menu:"tnq_menu_v1",user:"tnq_user_v1",asked:"tnq_asked_name_v1",big:"tnq_big_v1",qr:"tnq_qr_v1"};
var qrImg=""; try{qrImg=JSON.parse(localStorage.getItem("tnq_qr_v1")||'""')||"";}catch(e){qrImg="";}

/* ===== Thực đơn (sửa được trong app) và tên người dùng ===== */
function validMenu(list){
  if(!Array.isArray(list)||list.length>60) return null;
  var out=[];
  for(var i=0;i<list.length;i++){
    var m=list[i];
    if(!m||typeof m.id!=="string"||!/^[A-Za-z0-9_-]{1,60}$/.test(m.id)||typeof m.name!=="string"||typeof m.price!=="number"||!isFinite(m.price)||m.price<0) return null;
    out.push({id:m.id,name:m.name.slice(0,40),price:Math.round(m.price)});
  }
  return out;
}
function cleanMenu(list){
  return list.filter(function(m){return m&&String(m.name).trim()&&isFinite(m.price);}).map(function(m){return {id:m.id,name:String(m.name).trim().slice(0,40),price:Math.max(0,Math.round(m.price))};});
}
var MENU=validMenu(lsGet(KEY.menu,null))||clone(MENU_DEFAULT);
var userName=String(lsGet(KEY.user,"")||"");
function whoText(e){
  var a=e.startBy, z=e.closeBy;
  if(e.startTs){
    if(a&&z) return a+" bấm bắt đầu"+(a===z?" và kết thúc":", "+z+" bấm kết thúc");
    if(a) return a+" bấm bắt đầu";
    if(z) return z+" bấm kết thúc";
    return "";
  }
  return e.by?e.by+" lập bill":"";
}
function whoFull(e){
  var t=whoText(e), x=[];
  if(t) x.push(t);
  if(e.reopenBy) x.push(e.reopenBy+" mở lại");
  if(e.editedBy) x.push(e.editedBy+" sửa lúc "+fmtDT(e.editedTs));
  return x.join(" · ");
}
/* Người "chốt" bill: người bấm kết thúc (bill bàn) hoặc người lập bill (nhập tay). Cùng tên (không phân biệt hoa thường) thì tính chung. */
function payName(p){return p==='bank'?'Chuyển khoản':p==='cash'?'Tiền mặt':'Chưa ghi';}
function actor(e){return String(e.closeBy||e.by||e.startBy||"").replace(/\s+/g," ").trim();}
function nameKey(n){return n.toLowerCase();}
function whoLine(e){var t=whoFull(e), pt=e.kind==="bill"?"Thanh toán: "+payName(e.pay):"";if(pt) t=t?pt+" · "+t:pt;return t?'<p class="hint" style="margin:-4px 2px 10px">'+esc(t)+'</p>':'';}

/* ===== Tiện ích ===== */
function $(s){return document.querySelector(s);}
function pad(n){return n<10?"0"+n:""+n;}
function money(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+"đ";}
function short(n){
  if(n>=1e6) return (+(n/1e6).toFixed(1)+"").replace(".",",")+"tr";
  if(n>=1000) return (+(n/1000).toFixed(1)+"").replace(".",",")+"k";
  return ""+Math.round(n);
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function dayKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function keyToDate(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function fmtDate(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();}
function hm(d){return pad(d.getHours())+":"+pad(d.getMinutes());}
function fmtDT(ts){var d=new Date(ts);return fmtDate(d)+" "+hm(d);}
function fmtDM(ts){var d=new Date(ts);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+" "+hm(d);}
function nowHM(){return hm(nowDate());}
function toMin(t){var p=t.split(":");return (+p[0])*60+(+p[1]);}
function diffMin(s,e){var d=toMin(e)-toMin(s);return d<0?d+1440:d;}
function fmtDur(m){
  var h=Math.floor(m/60),r=m%60;
  if(h===0) return r+" phút";
  return r===0?h+" giờ":h+" giờ "+r+" phút";
}
function fmtClock(ms){
  var s=Math.max(0,Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  return pad(h)+":"+pad(m)+":"+pad(s%60);
}
function parseMoney(v){
  var s=String(v||"").trim().toLowerCase().replace(/[.,\s]/g,"");
  var n=parseInt(s,10);
  if(isNaN(n)) return 0;
  if(/tr$/.test(s)) return n*1000000;
  if(/k$/.test(s)) return n*1000;
  return n;
}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function isOpen(e){return e.kind==="bill"&&e.status==="open";}
function isDone(e){return e.kind==="bill"&&e.status!=="open";}
function sumItems(items){return (items||[]).reduce(function(s,i){return s+i.q*i.p;},0);}
function itemsText(items){return (items||[]).map(function(i){return i.q+" "+i.n;}).join(", ");}

/* ===== Tính tiền bida =====
   Dưới 1 giờ vẫn tính 1 giờ. Phần lẻ sau mỗi giờ tròn:
   1-15 phút +5k, 16-35 phút +15k, trên 35 phút tính thêm 1 giờ. */
function calcBida(min,type){
  var BIDA=BIDA_TYPES[type]||BIDA_TYPES.bang;
  min=Math.max(0,Math.floor(min));
  if(min<=60) return {amount:BIDA.hour, detail:"Tối thiểu 1 giờ"};
  var full=Math.floor(min/60), rem=min%60, extra=0, note="";
  if(rem===0){extra=0;}
  else if(rem<=BIDA.up1){extra=BIDA.add1;}
  else if(rem<=BIDA.up2){extra=BIDA.add2;}
  else {extra=BIDA.hour;}
  var base=full*BIDA.hour;
  if(extra>0) note=full+" giờ "+money(base)+" + lố "+rem+" phút "+money(extra);
  else note=full+" giờ";
  return {amount:base+extra, detail:note};
}

/* ===== Dữ liệu =====
   Mặc định lưu trên điện thoại (localStorage). Khi mở trong khung xem thử của Claude
   thì dùng kho dữ liệu có sẵn ở đó. */
var APP_VER="2611-e1556";
/* Đồng hồ chung: lệch giữa đồng hồ máy này và máy chủ, để mọi máy tính giờ chơi giống hệt nhau dù đồng hồ máy chạy lệch */
var clockOff=0;
try{clockOff=+JSON.parse(localStorage.getItem("tnq_clockoff_v1")||"0")||0;}catch(e){clockOff=0;}
function nowMs(){return new Date().getTime()+clockOff;}
function nowDate(){return new Date(nowMs());}
function syncClock(){
  if(!db||!window.firebase||!firebase.firestore||!firebase.firestore.FieldValue) return;
  var ref=db.collection("settings").doc("clock"), t0=new Date().getTime();
  ref.set({t:firebase.firestore.FieldValue.serverTimestamp(),by:userName||""})
    .then(function(){return ref.get({source:"server"});})
    .then(function(snap){
      var d=snap&&snap.data&&snap.data(); if(!d||!d.t||!d.t.toMillis) return;
      var t1=new Date().getTime(), off=d.t.toMillis()-(t0+(t1-t0)/2);
      if(Math.abs(off)<2000) off=0;
      clockOff=Math.round(off);
      try{localStorage.setItem("tnq_clockoff_v1",JSON.stringify(clockOff));}catch(e){}
    }).catch(function(){});
}
var entries=[], db=null, mode="local", wt={};
var shopName=lsGet(KEY.shop,DEFAULT_SHOP);
var draft=lsGet(KEY.draft,null)||{qty:{},other:"",otherNote:"",bida:false,start:"",end:""};
var state={tab:"tables",book:"bills",period:"7",histDays:7,open:null,cat:CATS[0],pending:null,sheet:null,menuOpen:{},timeEdit:{},renameId:null};
var loadTimer=null, deferredPrompt=null;
var fb=false, fbAuth=null, fbCfg=null, shopTimer=null, unsubs=[];

function newId(p){return p+new Date().getTime().toString(36)+Math.random().toString(36).slice(2,6);}
function saveDraft(){lsSet(KEY.draft,draft);}
function persistLocal(){lsSet(KEY.entries,entries);}
function getEntry(id){for(var i=0;i<entries.length;i++){if(entries[i].id===id)return entries[i];}return null;}
function putMemory(e){
  var found=false; entries=entries.map(function(x){if(x.id===e.id){found=true;return e;}return x;});
  if(!found) entries=entries.concat([e]);
}
/* Với Firebase, lệnh ghi hoàn tất ngay trên máy và tự đẩy lên khi có mạng,
   nên không chờ máy chủ trả lời (mất mạng vẫn bấm lưu được). */
function dbWrite(p){
  p.catch(function(){toast("Chưa lưu được, thử lại nhé");});
  return fb?Promise.resolve():p;
}
function putEntry(e,debounce){
  putMemory(e);
  if(!db){persistLocal();return Promise.resolve();}
  if(debounce){
    clearTimeout(wt[e.id]);
    wt[e.id]=setTimeout(function(){dbWrite(db.collection("entries").doc(e.id).set(e));},500);
    return Promise.resolve();
  }
  clearTimeout(wt[e.id]);
  return dbWrite(db.collection("entries").doc(e.id).set(e));
}
function delEntry(id){
  clearTimeout(wt[id]);
  entries=entries.filter(function(e){return e.id!==id;});
  if(db){return dbWrite(db.collection("entries").doc(id).delete());}
  persistLocal(); return Promise.resolve();
}

function needBackup(){
  if(mode!=="local"||!entries.length) return false;
  var last=lsGet(KEY.backup,0);
  if(!last){last=entries.reduce(function(m,e){return Math.min(m,e.ts||m);},nowMs());}
  return nowMs()-last>7*86400000;
}
function setSync(kind){
  var el=$("#sync"), txt="", warn=false;
  if(kind==="cloud") txt="Đồng bộ giữa các máy";
  else if(kind==="loading"){txt="Đang tải dữ liệu…";warn=true;}
  else if(kind==="offline"){txt="Đang mất mạng, có mạng sẽ tự đồng bộ";warn=true;}
  else if(kind==="slow"){txt="Chưa kết nối, số liệu có thể cũ";warn=true;}
  else {txt="Dữ liệu lưu trên điện thoại này";}
  var nb=needBackup();
  if(nb){txt+=" · nên sao lưu (bấm nút Cài đặt)";warn=true;}
  el.innerHTML='<span class="dot'+(warn?' warn':'')+'"></span><span>'+txt+'</span>';
  $("#gearBadge").hidden=!nb;
}

function stopListen(){unsubs.forEach(function(f){try{f();}catch(e){}});unsubs=[];}
/* Hai máy bấm "Khách vào" cùng một bàn gần như cùng lúc: giữ thẻ bấm trước, gộp đồ uống của thẻ sau vào rồi xoá thẻ sau. Mọi máy tính ra cùng một kết quả. */
function dedupeOpen(){
  var by={};
  entries.filter(isOpen).forEach(function(e){if(e.table){(by[e.table]=by[e.table]||[]).push(e);}});
  Object.keys(by).forEach(function(t){
    var g=by[t]; if(g.length<2) return;
    g.sort(function(a,b){return ((a.startTs||0)-(b.startTs||0))||(a.id<b.id?-1:1);});
    var win=clone(g[0]), changed=false, mine=false;
    g.slice(1).forEach(function(x){
      (x.items||[]).forEach(function(it){
        var f=win.items.filter(function(i){return i.k===it.k;})[0];
        if(f) f.q=Math.min(99,f.q+it.q); else win.items.push(clone(it));
        changed=true;
      });
      if(x.other){win.other=(win.other||0)+x.other;changed=true;}
      if(x.startBy&&x.startBy===userName) mine=true;
      delEntry(x.id);
    });
    if(changed) putEntry(win);
    if(mine){var tb=tableOf(t);toast((tb?tb.name:"Bàn")+" vừa được máy khác bấm trước, đã gộp lại");}
  });
}
function listen(){
  stopListen();
  entries=lsGet(KEY.cache,[]); setSync("loading"); renderData();
  loadTimer=setTimeout(function(){setSync(navigator.onLine===false?"offline":"slow");},10000);
  syncClock();
  unsubs.push(db.collection("entries").onSnapshot(function(snap){
    entries=snap.docs.map(function(d){return d.data();});
    if(!snap.metadata.fromCache) dedupeOpen();
    lsSet(KEY.cache,entries);
    if(!snap.metadata.fromCache){clearTimeout(loadTimer);setSync("cloud");}
    else if(navigator.onLine===false){clearTimeout(loadTimer);setSync("offline");}
    renderData(); tick();
  },function(){clearTimeout(loadTimer);setSync("slow");}));
  if(db){
    unsubs.push(db.collection("settings").doc("menu").onSnapshot(function(s){
      var d=s.exists?s.data():null, m=d?validMenu(JSON.parse(JSON.stringify(d.items||null))):null;
      if(!m||JSON.stringify(m)===JSON.stringify(MENU)) return;
      MENU=m; lsSet(KEY.menu,MENU);
      if(state.sheet==="menu") return;
      var ae=document.activeElement, typing=ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA");
      if(typing) return;
      renderCurrent();
    },function(){}));
    unsubs.push(db.collection("settings").doc("qr").onSnapshot(function(s){
      if(!s.exists&&s.metadata&&s.metadata.fromCache) return;
      var d=s.exists&&s.data(), v=(d&&typeof d.img==="string")?d.img:"";
      if(v===qrImg) return;
      qrImg=v; lsSet(KEY.qr,qrImg);
      if(state.sheet==="settings") showSettings();
    },function(){}));
    unsubs.push(db.collection("settings").doc("main").onSnapshot(function(s){
      var d=s.exists&&s.data();
      if(d&&typeof d.shop==="string"&&d.shop.trim()&&d.shop!==shopName){shopName=d.shop;lsSet(KEY.shop,shopName);applyShop();}
    },function(){}));
  }
}
function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=function(){rej(new Error("load "+src));};
    document.head.appendChild(s);
  });
}
function showLogin(msg){
  state.tab="login";
  $(".dock").hidden=true;
  $("#view").innerHTML='<section class="card"><h2>Đăng nhập</h2>'
    +'<p class="pr" style="margin:0 0 4px">Nhập mật khẩu chung của quán để dùng chung số liệu giữa các máy. Chỉ cần nhập một lần trên mỗi điện thoại.</p>'
    +'<label class="lb" for="pw">Mật khẩu của quán</label><input class="field" type="password" id="pw" autocomplete="current-password" autocapitalize="off">'
    +(msg?'<p class="hint" style="color:var(--bad)">'+esc(msg)+'</p>':'')
    +'<div style="height:12px"></div><button class="btn primary full" data-act="login">Đăng nhập</button></section>';
}
function afterLogin(){
  $(".dock").hidden=false;
  db=firebase.firestore();
  listen();
  go("tables");
  maybeAskName();
}
async function initFirebase(cfg){
  fbCfg=cfg; mode="cloud"; fb=true;
  entries=lsGet(KEY.cache,[]); setSync("loading");
  var base="https://www.gstatic.com/firebasejs/10.12.2/";
  try{
    await loadScript(base+"firebase-app-compat.js");
    await Promise.all([loadScript(base+"firebase-auth-compat.js"),loadScript(base+"firebase-firestore-compat.js")]);
    firebase.initializeApp(cfg.firebaseConfig);
    try{await firebase.firestore().enablePersistence({synchronizeTabs:true});}catch(e){}
    fbAuth=firebase.auth();
  }catch(e){
    fb=false; mode="local"; entries=lsGet(KEY.entries,[]); setSync("slow");
    toast("Chưa kết nối được máy chủ. Đang dùng số liệu trên máy này.");
    renderData(); return;
  }
  var started=false;
  fbAuth.onAuthStateChanged(function(u){
    if(u){ if(!started){started=true;afterLogin();} }
    else { started=false; stopListen(); showLogin(); }
  });
}
async function initData(){
  var inst=null;
  try{ inst=(window.claude&&window.claude.use)?await window.claude.use("db"):null; }catch(e){inst=null;}
  if(inst){ db=inst; mode="cloud"; listen(); maybeAskName(); return; }
  var cfg=window.TNQ_FIREBASE;
  if(cfg&&cfg.firebaseConfig&&cfg.firebaseConfig.apiKey&&cfg.email){ await initFirebase(cfg); return; }
  mode="local"; entries=lsGet(KEY.entries,[]); setSync("local"); renderData(); tick(); maybeAskName();
}

var toastT=null, undoFnCur=null;
function toast(msg,undo,ms){
  var t=$("#toast"); t.textContent="";
  var sp=document.createElement("span"); sp.textContent=msg; t.appendChild(sp);
  undoFnCur=undo||null;
  if(undo){
    var bt=document.createElement("button"); bt.type="button"; bt.setAttribute("data-act","undo"); bt.textContent="Hoàn tác";
    t.appendChild(bt);
  }
  t.hidden=false;
  clearTimeout(toastT);
  toastT=setTimeout(function(){t.hidden=true;undoFnCur=null;},ms||(undo?5000:2400));
}

/* ===== Hóa đơn ===== */
function tableLabel(e){
  var t=tableOf(e.table);
  if(t) return e.label?t.name+" · "+e.label:t.name;
  return e.label||"";
}
function openName(e){return tableLabel(e)||"Bida lúc "+hm(new Date(e.startTs));}
function receiptModel(e){
  var lines=[];
  (e.items||[]).forEach(function(i){
    lines.push({l:i.n+(i.q>1?" ×"+i.q:""), r:i.q*i.p, sub:i.q>1?[money(i.p)+" × "+i.q]:[]});
  });
  if(e.other>0) lines.push({l:"Khác"+(e.otherNote?" ("+e.otherNote+")":""), r:e.other, sub:[]});
  if(e.bida){
    lines.push({l:(BIDA_TYPES[e.bida.type]||BIDA_TYPES.bang).label, r:e.bida.amount,
      sub:[e.bida.start+" → "+e.bida.end, "Tổng giờ chơi: "+fmtDur(e.bida.minutes), e.bida.detail]});
  }

  if(obj&&typeof obj.shop==="string"&&obj.shop.trim()){shopName=obj.shop.trim();lsSet(KEY.shop,shopName);applyShop();}
  var rm=obj&&!Array.isArray(obj)?validMenu(obj.menu):null;
  if(rm&&rm.length){MENU=rm;saveMenu(true);}
  var done=function(){toast("Đã khôi phục "+ok.length+" mục");closeSheet();renderData();tick();};

    entries=Object.keys(map).map(function(k){return map[k];}); persistLocal(); done(); return;
  }
  var chain=Promise.resolve();
  ok.forEach(function(e){chain=chain.then(function(){return putEntry(e);});});
  chain.then(done,function(){toast("Khôi phục chưa xong, thử lại nhé");});
}

/* ===== Nháp bill nhập tay ===== */
function calcDraft(){
  var items=MENU.filter(function(m){return (draft.qty[m.id]||0)>0;}).map(function(m){return {k:m.id,n:m.name,q:draft.qty[m.id],p:m.price};});
  var drinks=sumItems(items), other=parseMoney(draft.other), bida=null;
  if(draft.bida&&draft.start){
    var end=draft.end||nowHM(), min=diffMin(draft.start,end), c=calcBida(min,draft.btype);
    bida={start:draft.start,end:end,minutes:min,amount:c.amount,detail:c.detail,type:draft.btype||"bang",tentative:!draft.end};
  }
  return {items:items,drinks:drinks,other:other,otherNote:(draft.otherNote||"").trim(),bida:bida,total:drinks+other+(bida?bida.amount:0)};
}

/* ===== Bàn đang chơi (bill chưa hoàn thành) ===== */
var LONG_MIN=120, WARN_MIN=180, SNOOZE_MS=3600000, warnSig="";
function warnList(now){
  return entries.filter(function(e){
    if(!isOpen(e)) return false;
    if(elapsedMs(e,now)<WARN_MIN*60000) return false;
    var ack=Math.max(e.ackTs||0,(state.ack&&state.ack[e.id])||0);
    return now-ack>=SNOOZE_MS;
  }).sort(function(a,b){return a.startTs-b.startTs;});
}
function updateWarn(now){
  var box=document.getElementById("warn"); if(!box) return;
  var list=warnList(now), sig=list.map(function(e){return e.id;}).join(",");
  if(sig!==warnSig){
    warnSig=sig;
    if(!list.length){box.hidden=true;box.innerHTML="";}
    else{
      var h="";
      list.forEach(function(e){
        h+='<div class="w">⚠ '+esc(openName(e))+' đã chạy <span data-wmin="'+e.id+'"></span>. Khách còn chơi không?'
          +'<div class="wb"><button type="button" data-act="ackLong" data-id="'+e.id+'">Còn chơi</button>'
          +'<button type="button" data-act="finish" data-id="'+e.id+'">Tính tiền</button></div></div>';
      });
      box.innerHTML=h; box.hidden=false;
      try{if(navigator.vibrate) navigator.vibrate([250,120,250]);}catch(er){}
    }
  }
  list.forEach(function(e){setT('[data-wmin="'+e.id+'"]',fmtDur(Math.floor(elapsedMs(e,now)/60000)));});
}
function elapsedMs(e,now){return Math.max(0,now-e.startTs-(e.pauseMs||0));}
function openCalc(e,now){
  var ms=elapsedMs(e,now), min=Math.floor(ms/60000), c=calcBida(min,e.btype);
  var drinks=sumItems(e.items), other=e.other||0;
  return {ms:ms,minutes:min,bida:c.amount,detail:c.detail,drinks:drinks,other:other,total:drinks+other+c.amount};
}
function closeOpen(e,now){

  x.bida={start:hm(s),end:hm(d),startTs:e.startTs,endTs:now,minutes:c.minutes,amount:c.bida,detail:c.detail,type:e.btype||"bang"};
  if(e.pauseMs>0) x.bida.paused=Math.round(e.pauseMs/60000);

/* ===== Chọn giờ bằng nút + / − (không dùng lịch của điện thoại) ===== */
function tpick(t,val,nowAct){
  var p=/^(\d\d):(\d\d)$/.exec(val||""), hh=p?p[1]:"--", mm=p?p[2]:"--";
  function row(u,v,lab,step){
    return '<div class="trow"><button class="sb" data-act="tadj" data-t="'+t+'" data-u="'+u+'" data-d="-1" aria-label="Bớt '+step+' '+lab+'">−</button>'
      +'<input class="tval num" data-show="'+t+'-'+u+'" data-tin="'+t+'|'+u+'" value="'+(v==="--"?"":v)+'" placeholder="--" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="Nhập số '+lab+'">'
      +'<button class="sb plus" data-act="tadj" data-t="'+t+'" data-u="'+u+'" data-d="1" aria-label="Thêm '+step+' '+lab+'">+</button><div class="tlab">'+lab+'</div></div>';
  }
  return '<div class="tpick">'+row("h",hh,"giờ",1)+row("m",mm,"phút",5)
    +(nowAct?'<button class="btn small" data-act="'+nowAct+'" style="align-self:flex-start">Lấy giờ bây giờ</button>':'')+'</div>';
}
function tGet(t){
  if(t==="start"||t==="end") return draft[t]||"";
  if(t==="estart"||t==="eend") return editE&&editE.bida?editE.bida[t==="estart"?"start":"end"]||"":"";
  if(t.indexOf("o:")===0){var e=getEntry(t.slice(2));return e?hm(new Date(e.startTs)):"";}
  return "";
}
function tSet(t,v){
  if(t==="start"||t==="end"){draft[t]=v;saveDraft();updateSell();}
  else if(t==="estart"||t==="eend"){if(editE&&editE.bida){editE.bida[t==="estart"?"start":"end"]=v;editUpdate();}}
  else if(t.indexOf("o:")===0){
    editOpen(t.slice(2),function(x){
      var d=nowDate(), q=v.split(":");
      d.setHours(+q[0],+q[1],0,0);
      if(d.getTime()>nowMs()) d=new Date(d.getTime()-86400000);
      x.startTs=d.getTime(); x.ts=x.startTs; x.openedTs=x.startTs;
    });
  }
  tShow(t);
}
function tShow(t){
  var v=tGet(t), p=/^(\d\d):(\d\d)$/.exec(v||"");
  var h=document.querySelector('[data-show="'+t+'-h"]'), m=document.querySelector('[data-show="'+t+'-m"]');
  if(h) h.value=p?p[1]:""; if(m) m.value=p?p[2]:"";
}
function tAdjust(t,u,d){
  var v=tGet(t)||nowHM(), q=v.split(":"), tot=(+q[0])*60+(+q[1]);
  if(u==="h") tot+=60*d;
  else tot=d>0?Math.floor(tot/5)*5+5:Math.ceil(tot/5)*5-5;
  tot=((tot%1440)+1440)%1440;
  tSet(t,pad(Math.floor(tot/60))+":"+pad(tot%60));
}

/* ===== Màn hình: Báo cáo ===== */
function periodKeys(p){
  var now=nowDate(), keys=[], i, d;
  if(p==="1"){keys.push(dayKey(now));}
  else if(p==="7"){for(i=6;i>=0;i--){d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);keys.push(dayKey(d));}}
  else{for(i=1;i<=now.getDate();i++){keys.push(dayKey(new Date(now.getFullYear(),now.getMonth(),i)));}}
  return keys;
}
function niceMax(v){var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p,m=n<=1?1:n<=2?2:n<=5?5:10;return m*p;}
function chartSVG(days){
  var W=340,H=190,L=40,R=8,T=12,B=24;
  var maxV=1;days.forEach(function(d){maxV=Math.max(maxV,d.rev,d.exp);});
  var top=niceMax(maxV), iw=W-L-R, ih=H-T-B, gw=iw/days.length, bw=Math.min(14,gw*0.36);
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Biểu đồ thu và chi theo ngày">';
  [0,0.5,1].forEach(function(f){
    var y=T+ih-f*ih;
    s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-5)+'" y="'+(y+3.5)+'" text-anchor="end">'+(f===0?"0":short(top*f))+'</text>';
  });
  var step=days.length>14?3:1;
  days.forEach(function(d,i){
    var cx=L+i*gw+gw/2, hr=d.rev/top*ih, he=d.exp/top*ih;
    if(d.rev>0) s+='<rect class="rev" x="'+(cx-bw-1)+'" y="'+(T+ih-Math.max(hr,1.5))+'" width="'+bw+'" height="'+Math.max(hr,1.5)+'" rx="2"/>';
    if(d.exp>0) s+='<rect class="exp" x="'+(cx+1)+'" y="'+(T+ih-Math.max(he,1.5))+'" width="'+bw+'" height="'+Math.max(he,1.5)+'" rx="2"/>';
    if(i%step===0||i===days.length-1){
      s+='<text x="'+cx+'" y="'+(H-7)+'" text-anchor="middle">'+d.label+'</text>';
    }
  });
  return s+'</svg>';
}
function repHTML(){
  var keys=periodKeys(state.period);
  var set={};keys.forEach(function(k){set[k]=1;});
  var bills=entries.filter(function(e){return isDone(e)&&set[e.day];});
  var exps=entries.filter(function(e){return e.kind==="expense"&&set[e.day];});
  var rev=bills.reduce(function(s,b){return s+b.total;},0);
  var exp=exps.reduce(function(s,e){return s+e.amount;},0);
  var profit=rev-exp;
  var drinks=0,bida=0,other=0,mins=0,sold={},bt={bang:{a:0,m:0},lo:{a:0,m:0}};
  bills.forEach(function(b){
    drinks+=b.drinks||0; other+=b.other||0;
    if(b.bida){bida+=b.bida.amount;mins+=b.bida.minutes;var tk=b.bida.type==="lo"?"lo":"bang";bt[tk].a+=b.bida.amount;bt[tk].m+=b.bida.minutes;}
    (b.items||[]).forEach(function(i){sold[i.n]=(sold[i.n]||0)+i.q;});
  });
  var byCat={};exps.forEach(function(e){byCat[e.cat]=(byCat[e.cat]||0)+e.amount;});

  var chartKeys=state.period==="1"?periodKeys("7"):keys;
  var cset={};chartKeys.forEach(function(k){cset[k]={rev:0,exp:0};});
  entries.forEach(function(e){var t=cset[e.day];if(!t)return;if(isDone(e))t.rev+=e.total;else if(e.kind==="expense")t.exp+=e.amount;});
  var cdays=chartKeys.map(function(k){var d=keyToDate(k);return {rev:cset[k].rev,exp:cset[k].exp,label:state.period==="30"?""+d.getDate():pad(d.getDate())+"/"+pad(d.getMonth()+1)};});
  var chartHas=cdays.some(function(d){return d.rev>0||d.exp>0;});
  var chartTitle=state.period==="30"?"Thu chi theo ngày trong tháng":"Thu chi 7 ngày gần nhất";

  var h='<div class="seg" role="group" aria-label="Khoảng thời gian">'
    +[["1","Hôm nay"],["7","7 ngày"],["30","Tháng này"]].map(function(p){return '<button data-act="period" data-p="'+p[0]+'" aria-pressed="'+(state.period===p[0])+'">'+p[1]+'</button>';}).join("")+'</div>';
  h+='<div class="stats"><div class="card big"><div class="stat-l">Lãi (thu trừ chi)</div><div class="stat-v '+(profit<0?'neg':'pos')+'">'+(profit<0?"−":"")+money(Math.abs(profit))+'</div></div>'
    +'<div class="card"><div class="stat-l">Doanh thu</div><div class="stat-v">'+money(rev)+'</div><div class="stat-s">'+bills.length+' bill</div></div>'
    +'<div class="card"><div class="stat-l">Tổng chi</div><div class="stat-v">'+money(exp)+'</div><div class="stat-s">'+exps.length+' khoản</div></div></div>';

  h+='<section class="card"><h2>'+chartTitle+'</h2>';
  if(chartHas){
    h+=chartSVG(cdays)+'<div class="legend"><span><i style="background:var(--rev)"></i>Thu</span><span><i style="background:var(--exp)"></i>Chi</span></div>';
  }else{
    h+='<div class="empty"><b>Chưa có số liệu</b>Lưu bill hoặc ghi khoản chi, biểu đồ sẽ hiện ở đây.</div>';
  }
  h+='</section>';

  if(rev>0){
    var src=[["Đồ uống",drinks,0],["Bida băng",bt.bang.a,bt.bang.m],["Bida lỗ",bt.lo.a,bt.lo.m],["Khác",other,0]];
    h+='<section class="card"><h2>Doanh thu theo nguồn</h2>';
    src.forEach(function(x){
      var pc=rev?Math.round(x[1]/rev*100):0;
      h+='<div class="kv"><div class="kvt"><span>'+x[0]+(x[2]?' · '+fmtDur(x[2]):'')+'</span><b>'+money(x[1])+'</b></div><div class="bar"><i style="width:'+pc+'%"></i></div></div>';
    });
    h+='</section>';
    var pay={cash:0,bank:0,none:0};
    bills.forEach(function(b){pay[b.pay==="bank"?"bank":b.pay==="cash"?"cash":"none"]+=b.total;});
    h+='<section class="card"><h2>Thu theo cách trả</h2>';
    [["Tiền mặt",pay.cash],["Chuyển khoản",pay.bank],["Chưa ghi (bill cũ)",pay.none]].forEach(function(x){
      if(x[0].indexOf("Chưa")===0&&!x[1]) return;
      var pc=rev?Math.round(x[1]/rev*100):0;
      h+='<div class="kv"><div class="kvt"><span>'+x[0]+'</span><b>'+money(x[1])+'</b></div><div class="bar"><i style="width:'+pc+'%"></i></div></div>';
    });
    h+='</section>';
    var pm={}, pk=[];
    bills.forEach(function(b){
      var nm=actor(b)||"Chưa ghi tên", k=nameKey(nm);
      if(!pm[k]){pm[k]={name:nm,rev:0,n:0};pk.push(k);}
      pm[k].rev+=b.total; pm[k].n++;
    });
    pk.sort(function(a,b){return pm[b].rev-pm[a].rev;});
    h+='<section class="card"><h2>Doanh số từng người</h2><p class="hint" style="margin:0 0 8px">Tính cho người bấm kết thúc hoặc lập bill. Cùng tên thì gộp, kể cả khi dùng nhiều máy.</p>';
    pk.forEach(function(k){
      var q=pm[k], pc=rev?Math.round(q.rev/rev*100):0;
      h+='<div class="kv"><div class="kvt"><span>'+esc(q.name)+' · '+q.n+' bill</span><b>'+money(q.rev)+'</b></div><div class="bar"><i style="width:'+pc+'%"></i></div></div>';
    });
    h+='</section>';
    var names=Object.keys(sold).sort(function(a,b){return sold[b]-sold[a];});
    if(names.length){
      h+='<section class="card"><h2>Bán được</h2>';
      names.forEach(function(n){h+='<div class="kv"><div class="kvt"><span>'+esc(n)+'</span><b>'+sold[n]+'</b></div></div>';});
      h+='</section>';
    }
  }
  var cats=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];});
  if(cats.length){
    h+='<section class="card"><h2>Chi theo loại</h2>';
    cats.forEach(function(c){
      var pc=exp?Math.round(byCat[c]/exp*100):0;
      h+='<div class="kv"><div class="kvt"><span>'+esc(c)+'</span><b>'+money(byCat[c])+'</b></div><div class="bar e"><i style="width:'+pc+'%"></i></div></div>';
    });
    h+='</section>';
  }
  return h;
}

/* ===== Cập nhật theo giây (đồng hồ, tạm tính) ===== */
function setT(sel,txt){var el=document.querySelector(sel);if(el&&el.textContent!==txt)el.textContent=txt;}
function tick(){
  var now=nowMs();
  updateWarn(now);
  if(state.tab==="tables"||state.tab==="book"){
    entries.forEach(function(e){
      if(!isOpen(e)) return;
      var c=openCalc(e,now), id=e.id, long=c.minutes>=LONG_MIN;
      setT('[data-clock="'+id+'"]',fmtClock(c.ms));
      setT('[data-rowclock="'+id+'"]',fmtClock(c.ms));
      setT('[data-rowtotal="'+id+'"]',money(c.total));
      setT('[data-tmin="'+id+'"]',fmtDur(c.minutes));
      setT('[data-tbida="'+id+'"]',money(c.bida));
      setT('[data-tdetail="'+id+'"]',c.detail);
      setT('[data-ttotal="'+id+'"]',money(c.total));
      setT('[data-pill="'+id+'"]',long?"Chơi lâu rồi":"Đang chơi");
      var card=document.getElementById("oc-"+id); if(card) card.classList.toggle("long",long);
      var sum=itemsText(e.items); if(e.other>0) sum+=(sum?", ":"")+"Khác "+money(e.other);
      setT('[data-tsum="'+id+'"]',sum?"Đã gọi: "+sum:"Chưa gọi đồ uống.");
      MENU.forEach(function(m){
        var it=(e.items||[]).filter(function(i){return i.k===m.id;})[0], q=it?it.q:0;
        setT("#oq-"+id+"-"+m.id,""+q);
        var row=document.getElementById("orow-"+id+"-"+m.id); if(row) row.classList.toggle("on",q>0);
      });
    });
  }
  if(state.tab==="sell"&&draft.bida&&draft.start&&!draft.end&&Math.floor(now/1000)%30===0) updateSell();
}

/* ===== Điều hướng ===== */
function renderCurrent(){
  if(state.tab==="tables") renderTables();
  else if(state.tab==="sell") renderSell();
  else if(state.tab==="book") renderBook();
}
function renderData(){
  var ae=document.activeElement, typing=ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA");

}
function setDockVar(){

function loadQrFile(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var sc=Math.min(1,1000/Math.max(im.width,im.height)), c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
      var x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
      var u=c.toDataURL("image/jpeg",0.9);
      if(u.length>800000) u=c.toDataURL("image/jpeg",0.7);
      if(u.length>800000) u=c.toDataURL("image/jpeg",0.5);
      cb(u.length>900000?null:u);
    };
    im.onerror=function(){cb(null);};
    im.src=fr.result;
  };
  fr.onerror=function(){cb(null);};
  fr.readAsDataURL(file);
}

  MENU.forEach(function(m){
    seen[m.id]=1;
    var it=editE.items.filter(function(i){return i.k===m.id;})[0];
    list.push({k:m.id,n:m.name,p:it?it.p:m.price});
  });
  editE.items.forEach(function(i){if(!seen[i.k]){seen[i.k]=1;list.push({k:i.k,n:i.n,p:i.p});}});
  return list;
}
function editBump(k,d){
  var it=editE.items.filter(function(i){return i.k===k;})[0];
  if(!it){
    var m=editItemList().filter(function(x){return x.k===k;})[0]; if(!m) return;
    it={k:m.k,n:m.n,q:0,p:m.p}; editE.items.push(it);
  }
  it.q=Math.max(0,Math.min(99,it.q+d));
}

/* ===== Gửi bill bằng hình ===== */
function fontsReady(){
  if(!(document.fonts&&document.fonts.load)) return Promise.resolve();
  return Promise.race([
    Promise.all([document.fonts.load('600 26px "Be Vietnam Pro"'),document.fonts.load('400 34px "Pacifico"')]),
    new Promise(function(r){setTimeout(r,1500);})
  ]).catch(function(){});
}
function wrapText(ctx,text,maxW){
  var words=String(text).split(" "), lines=[], cur="";
  words.forEach(function(w){
    var t=cur?cur+" "+w:w;
    if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;} else cur=t;
  });
  if(cur) lines.push(cur);
  return lines.length?lines:[""];
}
function runBill(ctx,m,draw){
  var W=640, P=36, y=P, F='"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  function T(s,x,yy,f,c,al){ctx.font=f;ctx.fillStyle=c;ctx.textAlign=al||"left";ctx.fillText(s,x,yy);}
  function rule(yy,dash,col,w){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash?[6,6]:[]);ctx.beginPath();ctx.moveTo(P,yy);ctx.lineTo(W-P,yy);ctx.stroke();ctx.restore();}
  ctx.textBaseline="alphabetic";
  y+=36; if(draw) T(m.shop,P,y,'400 34px "Pacifico",'+F,"#7b4a2d");
  y+=32; if(draw) T(m.date,P,y,'400 22px '+F,"#7a6454");
  if(m.label){y+=40; if(draw) T(m.label,P,y,'600 26px '+F,"#3a2418");}
  y+=22; if(draw) rule(y,true,"#c9b79c",2);
  m.lines.forEach(function(x){
    ctx.font='600 26px '+F;
    var wr=wrapText(ctx,x.l,W-2*P-190), y0;
    y+=42; y0=y;
    wr.forEach(function(w,i){if(i>0)y+=32; if(draw) T(w,P,y,'600 26px '+F,"#3a2418");});
    if(draw&&x.r!=null) T(money(x.r),W-P,y0,'600 26px '+F,"#3a2418","right");
    x.sub.forEach(function(s){
      ctx.font='400 21px '+F;
      wrapText(ctx,s,W-2*P-40).forEach(function(w){y+=28; if(draw) T(w,P+14,y,'400 21px '+F,"#7a6454");});
    });
    y+=8;
  });
  y+=16; if(draw) rule(y,false,"#3a2418",3);
  y+=48; if(draw){T("TỔNG CỘNG",P,y,'700 28px '+F,"#3a2418");T(money(m.total),W-P,y,'700 36px '+F,"#3a2418","right");}
  y+=44; if(draw) T("Cảm ơn quý khách!",W/2,y,'400 22px '+F,"#7a6454","center");
  y+=P;
  return y;
}
function makeBillImage(m){
  return fontsReady().then(function(){
    return new Promise(function(res,rej){
      var S=2, cv=document.createElement("canvas"), ctx=cv.getContext("2d");
      var H=runBill(ctx,m,false);
      cv.width=640*S; cv.height=Math.ceil(H*S);
      ctx=cv.getContext("2d"); ctx.scale(S,S);
      ctx.fillStyle="#fffaf2"; ctx.fillRect(0,0,640,H);
      ctx.strokeStyle="#e6d8c3"; ctx.lineWidth=2; ctx.strokeRect(1,1,638,H-2);
      runBill(ctx,m,true);
      cv.toBlob(function(b){if(!b){rej(new Error("blob"));return;}res({blob:b,url:cv.toDataURL("image/png")});},"image/png");
    });
  });
}
function showImage(url){
  var box=$("#copybox"); if(!box) return;
  box.innerHTML='<img class="billimg" alt="Hình bill" src="'+url+'"><p class="hint" style="margin:-6px 0 12px">Nhấn giữ vào hình, chọn Lưu hoặc Chia sẻ rồi gửi qua Zalo.</p>';

function shareImage(entry,model){

}

function emptyDraft(){return {qty:{},other:"",otherNote:"",bida:false,btype:"bang",start:"",end:""};}
var lastStart=0;

document.addEventListener("click",function(ev){
  var tabBtn=ev.target.closest("[data-tab]");
  if(tabBtn){go(tabBtn.dataset.tab);return;}
  var b=ev.target.closest("[data-act]");
  if(!b) return;
  var act=b.dataset.act, id=b.dataset.id;

  if(act==="undo"){
    var uf=undoFnCur; undoFnCur=null; $("#toast").hidden=true;
    if(uf) uf();
  }
  else if(act==="inc"||act==="dec"){
    var q=(draft.qty[id]||0)+(act==="inc"?1:-1); if(q<0)q=0; if(q>99)q=99;
    draft.qty[id]=q; saveDraft();
    $("#q-"+id).textContent=q; $("#row-"+id).classList.toggle("on",q>0); updateSell();
  }
  else if(act==="nowStart"){tSet("start",nowHM());}
  else if(act==="nowEnd"){tSet("end",nowHM());}
  else if(act==="tadj"){tAdjust(b.dataset.t,b.dataset.u,+b.dataset.d);}
  else if(act==="reset"){
    var prev=clone(draft);
    if(JSON.stringify(prev)===JSON.stringify(emptyDraft())){toast("Chưa nhập gì cả");return;}
    draft=emptyDraft(); saveDraft(); renderSell();
    toast("Đã xoá bill đang nhập",function(){draft=prev;saveDraft();if(state.tab==="sell")renderSell();});
  }
  else if(act==="calc"){
    if(draft.bida&&!draft.start){toast("Chưa có giờ bắt đầu bida");return;}
    if(draft.bida&&!draft.end){draft.end=nowHM();saveDraft();}
    var c=calcDraft();
    if(c.total<=0){toast("Bill chưa có món nào");return;}
    var now=nowMs();
    openReceipt({id:newId("b"),kind:"bill",status:"done",by:userName,ts:now,closedTs:now,day:dayKey(new Date(now)),items:c.items,drinks:c.drinks,other:c.other,otherNote:c.otherNote,bida:c.bida?{start:c.bida.start,end:c.bida.end,minutes:c.bida.minutes,amount:c.bida.amount,detail:c.bida.detail,type:c.bida.type}:null,total:c.total},"Quay lại sửa");
  }
  else if(act==="closeSheet"){closeSheet();}
  else if(act==="mergePick"){
    if(!state.pending) return;
    state.mergeSel={}; pendList().forEach(function(x,i){if(i>0)state.mergeSel[x.id]=true;});
    showMerge();
  }
  else if(act==="ackLong"){
    state.ack=state.ack||{}; state.ack[id]=nowMs();
    editOpen(id,function(x){x.ackTs=nowMs();});
    updateWarn(nowMs());
    toast("Ok, 1 tiếng nữa app sẽ nhắc lại nếu bàn vẫn mở");
  }
  else if(act==="splitPick"){if(!state.pending) return; state.splitTake={}; showSplit();}
  else if(act==="splitInc"||act==="splitDec"){
    var sk=b.dataset.k, sit=(state.pending.items||[]).filter(function(i){return i.k===sk;})[0]; if(!sit) return;
    var sq=(state.splitTake[sk]||0)+(act==="splitInc"?1:-1);
    state.splitTake[sk]=Math.max(0,Math.min(sit.q,sq)); showSplit();
  }
  else if(act==="splitGo"){
    var po=state.pending, sn=po.closedTs||nowMs(), sitems=[], stot=0;
    (po.items||[]).forEach(function(i){var q=state.splitTake[i.k]||0; if(q>0){sitems.push({k:i.k,n:i.n,q:q,p:i.p});stot+=q*i.p;}});
    if(!sitems.length) return;
    openReceipt({id:newId("b"),kind:"bill",status:"done",by:userName,closeBy:userName,ts:sn,closedTs:sn,day:dayKey(new Date(sn)),table:po.table,btype:po.btype,label:po.label||"",items:sitems,drinks:stot,other:0,otherNote:"",bida:null,total:stot,part:1,_split:{id:po.id,take:clone(state.splitTake)}},"Quay lại");
  }
  else if(act==="mergeTog"){state.mergeSel[id]=!state.mergeSel[id]; showMerge();}
  else if(act==="mergeGo"){
    var gl=[state.pending], gnow=state.pending.closedTs||nowMs();
    otherOpens().forEach(function(x){if(state.mergeSel[x.id]) gl.push(closeOpen(x,gnow));});
    openReceipt(state.pending,state.pendingBack,gl.length>1?gl:null);
  }
  else if(act==="sheetCopy"){var t=receiptText(pendModel());copyText(t,function(){showCopyFallback(t);});}
  else if(act==="sheetImage"){if(state.pending) shareImage(state.pending,pendModel());}
  else if(act==="sheetSave"){
    var e=state.pending; if(!e) return;
    if(b.dataset.pay==="bank"&&qrImg&&!b.dataset.qr){showQr(e);return;}
    var wasOpen=!!e.startTs, plist=pendList(), sp=e._split||null;
    if(sp){
      var so=getEntry(sp.id), sbad=!so||!isOpen(so);
      if(!sbad) for(var sk2 in sp.take){var si=(so.items||[]).filter(function(i){return i.k===sk2;})[0]; if(sp.take[sk2]>0&&(!si||si.q<sp.take[sk2])) sbad=true;}
      if(sbad){toast("Bàn đã đổi ở máy khác, hãy thử lại");closeSheet();renderCurrent();return;}
      var sv=clone(e); delete sv._split; plist=[sv];
    }
    if(wasOpen){
      var bad=plist.some(function(x){var cur=getEntry(x.id);return !cur||!isOpen(cur);});
      if(bad){toast("Có bàn đã được tính tiền hoặc huỷ ở máy khác");closeSheet();renderCurrent();return;}
    }
    var gid=plist.length>1?newId("g"):null, pay=b.dataset.pay==="bank"?"bank":"cash", ptot=pendTotal();
    plist.forEach(function(x){x.pay=pay; if(gid)x.group=gid;});
    b.disabled=true;
    Promise.all(plist.map(function(x){return putEntry(x);})).then(function(){
      if(sp){
        editOpen(sp.id,function(x){
          x.items.forEach(function(i){i.q=Math.max(0,i.q-(sp.take[i.k]||0));});
          x.items=x.items.filter(function(i){return i.q>0;});
        });
      }else if(!wasOpen){draft=emptyDraft();saveDraft();}
      closeSheet(); toast(sp?"Đã tính phần nước riêng "+money(ptot)+" · "+payName(pay)+". Bàn vẫn đang mở.":"Đã lưu bill"+(gid?" gộp "+plist.length+" bàn ":" ")+money(ptot)+" · "+payName(pay));
      renderCurrent();
    },function(){b.disabled=false;toast("Không lưu được, thử lại nhé");});
  }
  else if(act==="startTimer"){
    if(nowMs()-lastStart<1500) return;
    lastStart=nowMs();
    var tb=tableOf(id);
    if(!tb) return;
    if(openOn(id)){toast(tb.name+" đang có khách rồi");renderTables();return;}
    var nm=tb.name, r=startTimer(id);
    r.p.then(function(){
      renderTables();
      var card=document.getElementById("oc-"+r.id); if(card) card.scrollIntoView({block:"nearest"});
      toast("Đã bắt đầu "+nm+" lúc "+nowHM(),function(){delEntry(r.id).then(renderCurrent);});
    },function(){toast("Không lưu được, thử lại nhé");});
  }
  else if(act==="gotoSell"){go("sell");}
  else if(act==="btype"){draft.btype=b.dataset.k;saveDraft();var cs=document.querySelectorAll('[data-act="btype"]');for(var ci=0;ci<cs.length;ci++)cs[ci].setAttribute("aria-pressed",cs[ci].dataset.k===draft.btype?"true":"false");updateSell();}
  else if(act==="toggleMenu"){
    state.menuOpen[id]=!state.menuOpen[id];
    var mb=$("#mb-"+id); mb.hidden=!state.menuOpen[id];
    b.textContent=state.menuOpen[id]?"Ẩn danh sách":"+ Gọi nước";
    b.setAttribute("aria-expanded",state.menuOpen[id]?"true":"false");
  }
  else if(act==="toggleTime"){
    state.timeEdit[id]=!state.timeEdit[id];
    var te=$("#te-"+id); if(te) te.hidden=!state.timeEdit[id];
  }
  else if(act==="oinc"||act==="odec"){
    var k=b.dataset.k;
    editOpen(id,function(x){
      var it=x.items.filter(function(i){return i.k===k;})[0];
      if(!it){var m=MENU.filter(function(z){return z.id===k;})[0];if(!m)return;it={k:m.id,n:m.name,q:0,p:m.price};x.items.push(it);}
      it.q=Math.max(0,Math.min(99,it.q+(act==="oinc"?1:-1)));
      x.items=x.items.filter(function(i){return i.q>0;});
    });
  }
  else if(act==="renameTable"){
    var er=getEntry(id); if(!er) return;
    state.renameId=id;
    openSheet("rename",'<h3>Ghi tên khách</h3><label class="lb" for="renameInput" style="margin-top:0">Tên khách (không bắt buộc)</label>'
      +'<input class="field" id="renameInput" autocomplete="off" placeholder="VD: anh Tuấn" value="'+esc(er.label||"")+'">'
      +'<div style="height:12px"></div><div class="split"><button class="btn" data-act="closeSheet">Thôi</button><button class="btn primary" data-act="saveRename">Lưu</button></div>');
    var ri=$("#renameInput"); if(ri){ri.focus();ri.select();}
  }
  else if(act==="saveRename"){
    var rv=(($("#renameInput")||{}).value||"").trim().slice(0,30), rid=state.renameId;
    closeSheet();
    editOpen(rid,function(x){x.label=rv;});
    renderTables();
  }
  else if(act==="backReceipt"){if(state.pending) openReceipt(state.pending,state.pendingBack);}
  else if(act==="delQr"){var pq=qrImg; setQr(""); showSettings(); toast("Đã xoá mã QR",function(){setQr(pq);if(state.sheet==="settings")showSettings();});}
  else if(act==="resetAll"){
    $("#toast").hidden=true; undoFnCur=null;
    openSheet("reset",'<div class="askq">Xoá hết số liệu?</div><p class="hint" style="text-align:center;margin:0 0 14px">'
      +(mode==="cloud"?'Tất cả bill, bàn đang chơi và khoản chi sẽ bị xoá trên mọi máy dùng chung.':'Tất cả bill, bàn đang chơi và khoản chi trên máy này sẽ bị xoá.')+' Không lấy lại được. Nên lưu dự phòng trước.</p>'
      +'<div class="stack"><button class="btn lg" data-act="backup">Lưu dự phòng trước</button>'
      +'<button class="btn lg" data-act="closeSheet">Không, giữ lại</button>'
      +'<button class="btn lg danger" data-act="resetAll2">Tiếp tục xoá…</button></div>');
  }
  else if(act==="resetAll2"){
    askConfirm("Chắc chắn xoá hết? Không lấy lại được.","Đúng, xoá hết",function(){
      var list=entries.slice();
      Promise.all(list.map(function(e){return delEntry(e.id);})).then(function(){
        draft=emptyDraft(); saveDraft(); state.open=null;
        go("tables"); toast("Đã xoá hết số liệu ("+list.length+" mục)");
      },function(){toast("Chưa xoá hết được, thử lại nhé");});
    },true);
  }
  else if(act==="confirmYes"){var cf=confirmFn; confirmFn=null; closeSheet(); if(cf) cf();}
  else if(act==="finish"){
    var eo=getEntry(id); if(!eo||!isOpen(eo)) return;
    askConfirm("Tính tiền "+openName(eo)+" phải không?","Đúng, tính tiền",function(){
      var e2=getEntry(id); if(!e2||!isOpen(e2)){renderCurrent();return;}
      openReceipt(closeOpen(e2,nowMs()),"Chưa tính, quay lại");
    });
  }
  else if(act==="cancelOpen"){
    var oc=getEntry(id); if(!oc) return;
    askConfirm("Huỷ "+openName(oc)+" phải không? Giờ chơi sẽ không được tính.","Đúng, huỷ",function(){
      var oc2=getEntry(id); if(!oc2) return;
      var occ=clone(oc2);
      delEntry(id).then(function(){
        renderCurrent();
        toast("Đã huỷ "+openName(occ),function(){putEntry(occ).then(renderCurrent);});
      });
    },true);
  }
  else if(act==="gotoOpen"){go("tables");var card2=document.getElementById("oc-"+id);if(card2)card2.scrollIntoView();}
  else if(act==="booktab"){state.book=b.dataset.b;state.open=null;renderBook();window.scrollTo(0,0);}
  else if(act==="toggle"){state.open=(state.open===id)?null:id;renderBook();}
  else if(act==="copyEntry"){
    var en=getEntry(id); if(!en) return;
    var tx=receiptText(receiptModel(en)); copyText(tx,function(){showCopyFallback(tx);});
  }
  else if(act==="imgEntry"){var ei2=getEntry(id); if(ei2) shareImage(ei2);}
  else if(act==="reopen"){
    var e0=getEntry(id); if(!e0||!e0.startTs) return;
    var rx=clone(e0), rn=nowMs();
    rx.status="open"; rx.reopenBy=userName; delete rx.pay; rx.pauseMs=(rx.pauseMs||0)+Math.max(0,rn-(rx.closedTs||rn));
    delete rx.closedTs; delete rx.closeBy;
    rx.bida=null; rx.total=0; rx.ts=rx.startTs; rx.day=dayKey(new Date(rx.startTs));
    putEntry(rx).then(function(){
      go("tables");
      toast("Đã mở lại "+openName(rx)+". Giờ chơi tiếp tục tính, phần lúc dừng được trừ ra.");
    },function(){toast("Không mở lại được, thử lại nhé");});
  }
  else if(act==="editBill"){showEdit(id);}
  else if(act==="eInc"||act==="eDec"){if(editE){editBump(b.dataset.k,act==="eInc"?1:-1);editUpdate();}}
  else if(act==="epay"){
    if(editE){editE.pay=b.dataset.k;var pc=document.querySelectorAll('[data-act="epay"]');for(var pi=0;pi<pc.length;pi++)pc[pi].setAttribute("aria-pressed",pc[pi].dataset.k===editE.pay?"true":"false");}
  }
  else if(act==="saveEdit"){
    var cur2=getEntry(id);
    if(!cur2||!editE){toast("Bill này không còn nữa");closeSheet();renderCurrent();return;}
    editE.items=editE.items.filter(function(i){return i.q>0;});
    editE.label=(editE.label||"").trim();
    editUpdate();
    editE.editedBy=userName; editE.editedTs=nowMs();
    var ee=editE;
    putEntry(ee).then(function(){closeSheet();renderCurrent();toast("Đã lưu thay đổi");},function(){toast("Không lưu được, thử lại nhé");});
  }
  else if(act==="del"){
    var od=getEntry(id); if(!od) return;
    var isExp=od.kind==="expense";
    askConfirm(isExp?"Xoá khoản chi "+money(od.amount)+" phải không?":"Xoá bill "+money(od.total)+" phải không?","Đúng, xoá",function(){
      var od2=getEntry(id); if(!od2) return;
      var cp=clone(od2);
      var msg=isExp?"Đã xoá khoản chi "+money(od2.amount):"Đã xoá bill "+money(od2.total);
      delEntry(id).then(function(){
        state.open=null; renderCurrent();
        toast(msg,function(){putEntry(cp).then(renderCurrent);});
      },function(){toast("Không xoá được, thử lại nhé");});
    },true);
  }
  else if(act==="moreHist"){state.histDays+=14;renderBook();}
  else if(act==="cat"){
    state.cat=b.dataset.cat;
    var chips=document.querySelectorAll(".chip");
    for(var i=0;i<chips.length;i++) chips[i].setAttribute("aria-pressed",chips[i].dataset.cat===state.cat?"true":"false");
  }
  else if(act==="saveExp"){
    var amt=parseMoney($("#expAmt").value), day=$("#expDate").value||dayKey(nowDate());
    if(amt<=0){toast("Nhập số tiền chi");return;}
    var ex={id:newId("e"),kind:"expense",by:userName,ts:nowMs(),day:day,amount:amt,cat:state.cat,note:$("#expNote").value.trim()};
    b.disabled=true;
    putEntry(ex).then(function(){toast("Đã lưu khoản chi "+money(amt));renderBook();},function(){b.disabled=false;toast("Không lưu được, thử lại nhé");});
  }
  else if(act==="period"){state.period=b.dataset.p;renderBook();}
  else if(act==="settings"){showSettings();}
  else if(act==="install"){doInstall();}
  else if(act==="hideInstall"){lsSet(KEY.hide,true);renderTables();}
  else if(act==="backup"){downloadBackup();}
  else if(act==="shareBackup"){shareBackup();}
  else if(act==="editMenu"){showMenu();}
  else if(act==="addMenu"){
    MENU.push({id:newId("m"),name:"",price:0}); saveMenu(false); showMenu();
    var ni=document.getElementById("mn-"+(MENU.length-1)); if(ni) ni.focus();
  }
  else if(act==="delMenu"){
    var di=+b.dataset.i, rmv=MENU.splice(di,1)[0];
    saveMenu(true); showMenu();
    if(rmv) toast("Đã xoá món "+(rmv.name||"chưa đặt tên"),function(){
      MENU.splice(di,0,rmv); saveMenu(true);
      if(state.sheet==="menu") showMenu(); else renderCurrent();
    });
  }
  else if(act==="saveName"){
    var nv=(($("#askName")||{}).value||"").trim().slice(0,20);
    if(!nv){toast("Nhập tên của bạn");return;}
    userName=nv; lsSet(KEY.user,userName); closeSheet(); toast("Xin chào "+nv);
  }
  else if(act==="login"){doLogin();}
  else if(act==="logout"){
    closeSheet();
    if(fbAuth) fbAuth.signOut().then(function(){entries=[];lsSet(KEY.cache,[]);},function(){});
  }
  else if(act==="uploadLocal"){
    var old=lsGet(KEY.entries,[]), chain=Promise.resolve();
    old.forEach(function(e){chain=chain.then(function(){return putEntry(e);});});
    chain.then(function(){lsSet(KEY.entries,[]);toast("Đã đưa "+old.length+" mục lên dùng chung");closeSheet();renderData();},function(){toast("Chưa đưa lên được, thử lại nhé");});
  }
});

function doLogin(){
  var pw=($("#pw")||{}).value||"";
  if(!pw){toast("Nhập mật khẩu của quán");return;}
  if(!fbAuth||!fbCfg) return;
  fbAuth.signInWithEmailAndPassword(fbCfg.email,pw).catch(function(err){
    var c=err&&err.code||"";
    showLogin(/network/.test(c)?"Không có mạng, thử lại khi có mạng.":"Sai mật khẩu, thử lại nhé.");
  });
}
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target&&ev.target.id==="pw"){ev.preventDefault();doLogin();}
});

document.addEventListener("focusin",function(ev){var t=ev.target;if(t&&t.dataset&&t.dataset.tin){setTimeout(function(){try{t.select();}catch(e){}},0);}});
document.addEventListener("input",function(ev){
  var t=ev.target, tid=t.id||"";
  if(tid==="other"){draft.other=t.value;saveDraft();updateSell();}
  else if(tid==="otherNote"){draft.otherNote=t.value;saveDraft();}
  else if(tid==="ed-other"&&editE){editE.other=parseMoney(t.value);editUpdate();}
  else if(tid==="shopName"){
    shopName=t.value.trim()||DEFAULT_SHOP;lsSet(KEY.shop,shopName);applyShop();
    if(db){clearTimeout(shopTimer);var nm=shopName;shopTimer=setTimeout(function(){db.collection("settings").doc("main").set({shop:nm}).catch(function(){});},700);}
  }
  else if(tid==="userName"){userName=t.value.trim().slice(0,20);lsSet(KEY.user,userName);}
  else if(t.dataset&&t.dataset.mname!==undefined){var mi=MENU[+t.dataset.mname];if(mi){mi.name=t.value;saveMenu(false);}}
  else if(t.dataset&&t.dataset.mprice!==undefined){var mj=MENU[+t.dataset.mprice];if(mj){mj.price=parseMoney(t.value);saveMenu(false);}}
  else if(t.dataset&&t.dataset.oother){var v=t.value;editOpen(t.dataset.oother,function(x){x.other=parseMoney(v);});}
  else if(t.dataset&&t.dataset.onote){var n=t.value;editOpen(t.dataset.onote,function(x){x.otherNote=n;});}
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="bidaOn"){
    draft.bida=t.checked;saveDraft();
    $("#bidaBox").hidden=!draft.bida;updateSell();
  }
  else if(t.id==="bigText"){setBig(t.checked);}
  else if(t.id==="qrFile"&&t.files&&t.files[0]){
    loadQrFile(t.files[0],function(u){
      if(!u){toast("Không đọc được ảnh, chọn ảnh khác nhé");return;}
      setQr(u); if(state.sheet==="settings") showSettings(); toast("Đã lưu mã QR");
    });
  }
  else if(t.dataset&&t.dataset.tin){
    var tp=t.dataset.tin.split("|"), tt=tp[0], uu=tp[1], n=parseInt(t.value,10);
    if(isNaN(n)){tShow(tt);return;}
    var cur=(tGet(tt)||nowHM()).split(":"), hh=+cur[0], mm=+cur[1];
    if(uu==="h") hh=Math.max(0,Math.min(23,n)); else mm=Math.max(0,Math.min(59,n));
    tSet(tt,pad(hh)+":"+pad(mm));
  }
  else if(t.id==="restoreFile"&&t.files&&t.files[0]){
    var r=new FileReader();
    r.onload=function(){restoreFrom(String(r.result));};
    r.onerror=function(){toast("Không đọc được file");};
    r.readAsText(t.files[0]);
  }
});
$("#sheet").addEventListener("click",function(ev){if(ev.target.id==="sheet")closeSheet();});

window.addEventListener("beforeinstallprompt",function(ev){ev.preventDefault();deferredPrompt=ev;});
window.addEventListener("appinstalled",function(){deferredPrompt=null;lsSet(KEY.hide,true);toast("Đã cài ThuongNhoQuan");renderCurrent();});

setInterval(tick,1000);

/* ===== Khởi động ===== */
var nd=nowDate();
$("#today").textContent=DAYS[nd.getDay()]+", "+fmtDate(nd);
applyShop();
setSync("local");
try{if(lsGet(KEY.big,false)) document.documentElement.classList.add("bigtext");}catch(e){}
go("tables");
initData();

function showUpdate(){
  if(document.getElementById("updbar")) return;
  var b=document.createElement("div"); b.id="updbar"; b.className="updbar"; b.setAttribute("role","status");
  b.innerHTML='<span>Có bản app mới</span><button type="button" id="updBtn">Cập nhật ngay</button>';
  document.body.appendChild(b);
  document.getElementById("updBtn").addEventListener("click",function(){location.reload();});
}
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.claude){
  var hadCtl=!!navigator.serviceWorker.controller, swReg=null;
  navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadCtl) showUpdate();});
  window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").then(function(r){swReg=r;}).catch(function(){});});
  var chk=function(){if(swReg) swReg.update().catch(function(){});};
  setInterval(chk,600000);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){chk();syncClock();}});
}
setInterval(syncClock,900000);
})();
</script>

</body>
